        ).then(
            r => r.json()
        ),

        fetch(
            "./dammam.geojson"
        ).then(
            r => r.json()
        ),

        fetch(
            "./dhahran.geojson"
        ).then(
            r => r.json()
        ),

        fetch(
            "./khobar.geojson"
        ).then(
            r => r.json()
        )

    ]

)

.then(

    ([
        municipalityData,
        dammamData,
        dhahranData,
        khobarData
    ]) => {

        /* =================================================
           MUNICIPALITY BOUNDARIES
           ================================================= */

        if (

            municipalityData &&

            Array.isArray(
                municipalityData.features
            )

        ) {

            municipalityData.features.forEach(

                feature => {

                    const name =

                        String(

                            feature.properties?.REMARKS ||

                            feature.properties?.NameEn ||

                            feature.properties?.NAME ||

                            feature.properties?.name ||

                            ""

                        ).trim();

                    let city =
                        null;

                    if (
                        name === "الدمام"
                    ) {

                        city =
                            "Dammam";

                    }
                    else if (
                        name === "الظهران"
                    ) {

                        city =
                            "Dhahran";

                    }
                    else if (
                        name === "الخبر"
                    ) {

                        city =
                            "Khobar";

                    }
                    else {

                        const normalized =
                            normalizeName(
                                name
                            );

                        if (
                            normalized ===
                            "dammam"
                        ) {

                            city =
                                "Dammam";

                        }
                        else if (
                            normalized ===
                            "dhahran"
                        ) {

                            city =
                                "Dhahran";

                        }
                        else if (
                            normalized ===
                            "khobar"
                        ) {

                            city =
                                "Khobar";

                        }

                    }

                    if (!city) {

                        return;

                    }

                    if (
                        !municipalityBoundaryFeatures[city]
                    ) {

                        municipalityBoundaryFeatures[city] =
                            [];

                    }

                    municipalityBoundaryFeatures[city]
                        .push(
                            feature
                        );

                    const boundary =
                        L.geoJSON(

                            feature,

                            {

                                style:
                                    boundaryStyle(
                                        city
                                    )
                            }

                        );

                    boundary.bindTooltip(

                        `
                        <b>Municipality:</b>
                        ${city}
                        <br>
                        <b>Total Incidents:</b>
                        ${Number(
                            municipalityTotals[city] || 0
                        ).toLocaleString()}
                        `,

                        {

                            sticky:
                                true,

                            direction:
                                "top",

                            opacity:
                                0.95,

                            className:
                                "custom-tooltip"
                        }

                    );

                    boundary.on(

                        "click",

                        function() {

                            showMunicipality(
                                city
                            );

                        }

                    );

                    /* -------------------------------------
                       Hover only changes border.
                       Fill remains same color.
                       ------------------------------------- */

                    boundary.on(

                        "mouseover",

                        function() {

                            const color =
                                CITY_COLOR[city];

                            boundary.setStyle({

                                weight:
                                    3.2,

                                color:
                                    color,

                                fillColor:
                                    color,

                                fillOpacity:
                                    0.08

                            });

                        }

                    );

                    boundary.on(

                        "mouseout",

                        function() {

                            boundary.setStyle(
                                boundaryStyle(
                                    city
                                )
                            );

                        }

                    );

                    municipalityBoundaryLayers[
                        city
                    ] =
                        boundary;

                    const center =
                        boundary
                            .getBounds()
                            .getCenter();

                    municipalityCenters[
                        city
                    ] = {

                        lat:
                            center.lat,

                        long:
                            center.lng
                    };

                    /* -------------------------------------
                       IMPORTANT:
                       Add boundary once.
                       It will remain visible at all levels.
                       ------------------------------------- */

                    boundary.addTo(
                        map
                    );

                }

            );

        }

        /* =================================================
           DISTRICT LAYERS
           ================================================= */

        const dammamDistricts =
            makeDistrictNodes(
                dammamData,
                "Dammam"
            );

        const dhahranDistricts =
            makeDistrictNodes(
                dhahranData,
                "Dhahran"
            );

        const khobarDistricts =
            makeDistrictNodes(
                khobarData,
                "Khobar"
            );

        /* =================================================
           LAYER TREE
           ================================================= */

        const overlaysTree = {

            label:
                "Map Layers",

            selectAllCheckbox:
                false,

            children:

                [

                    {

                        label:
                            "Dammam",

                        selectAllCheckbox:
                            true,

                        children:

                            [

                                {

                                    label:
                                        "Boundary",

                                    layer:
                                        municipalityBoundaryLayers
                                            .Dammam
                                },

                                {

                                    label:
                                        "Districts",

                                    selectAllCheckbox:
                                        true,

                                    children:
                                        dammamDistricts
                                }

                            ]
                    },

                    {

                        label:
                            "Dhahran",

                        selectAllCheckbox:
                            true,

                        children:

                            [

                                {

                                    label:
                                        "Boundary",

                                    layer:
                                        municipalityBoundaryLayers
                                            .Dhahran
                                },

                                {

                                    label:
                                        "Districts",

                                    selectAllCheckbox:
                                        true,

                                    children:
                                        dhahranDistricts
                                }

                            ]
                    },

                    {

                        label:
                            "Khobar",

                        selectAllCheckbox:
                            true,

                        children:

                            [

                                {

                                    label:
                                        "Boundary",

                                    layer:
                                        municipalityBoundaryLayers
                                            .Khobar
                                },

                                {

                                    label:
                                        "Districts",

                                    selectAllCheckbox:
                                        true,

                                    children:
                                        khobarDistricts
                                }

                            ]
                    }

                ]
        };

        L.control.layers.tree(

            {

                "Satellite":
                    satellite

            },

            overlaysTree,

            {

                collapsed:
                    false,

                namedToggle:
                    true,

                selectorBack:
                    false,

                closedSymbol:
                    "▶",

                openedSymbol:
                    "▼"

            }

        ).addTo(
            map
        );

        /* =================================================
           INITIAL EXTENT
           ================================================= */

        const boundaries =

            CITIES

                .map(
                    city =>
                        municipalityBoundaryLayers[city]
                )

                .filter(Boolean);

        if (
            boundaries.length
        ) {

            const group =
                L.featureGroup(
                    boundaries
                );

            const bounds =
                group.getBounds();

            if (
                bounds.isValid()
            ) {

                map.fitBounds(

                    bounds,

                    {

                        padding:
                            [30,30],

                        animate:
                            false
                    }

                );

            }

        }

        /* =================================================
           LEGEND
           ================================================= */

        const legend =
            L.control({

                position:
                    "bottomleft"

            });

        legend.onAdd =
            function() {

                const div =
                    L.DomUtil.create(

                        "div",

                        "risk-legend"

                    );

                div.innerHTML =

                    `

                    <div class="risk-legend-title">
                        Incident Risk
                    </div>

                    <div class="legend-row">
                        <span class="legend-color legend-green"></span>
                        <span>Low</span>
                    </div>

                    <div class="legend-row">
                        <span class="legend-color legend-yellow"></span>
                        <span>Medium</span>
                    </div>

                    <div class="legend-row">
                        <span class="legend-color legend-red"></span>
                        <span>High</span>
                    </div>

                    `;

                return div;

            };

        legend.addTo(
            map
        );

        /* =================================================
           MAP READY
           ================================================= */

        mapReady =
            true;

        if (
            pendingIncidentData
        ) {

            applyIncidentData(
                pendingIncidentData
            );

            pendingIncidentData =
                null;

        }
        else {

            showMunicipalityOverview();

        }

        /* =================================================
           GRAFANA READY
           ================================================= */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );

    }

)

.catch(

    err => {

        console.error(
            "Error loading GeoJSON:",
            err
        );

        updateMapInfo(
            "Unable to load map data"
        );

    }

);

/* =========================================================
   APPLY GRAFANA DATA
   ========================================================= */

function applyIncidentData(
    rows
) {

    dataVersion++;

    /* =====================================================
       CLEAR DATA
       ===================================================== */

    Object.keys(
        districtCounts
    ).forEach(
        key => {

            delete districtCounts[key];

        }
    );

    Object.keys(
        districtNameLookup
    ).forEach(
        key => {

            delete districtNameLookup[key];

        }
    );

    CITIES.forEach(
        city => {

            municipalityTotals[city] =
                0;

            municipalityIncidentRows[city] =
                [];

            delete cityDistrictCache[city];

            delete cityGroupCache[city];

        }
    );

    /* =====================================================
       PROCESS GRAFANA ROWS
       ===================================================== */

    (rows || []).forEach(
        row => {

            const name =
                String(
                    row.state || ""
                ).trim();

            const count =
                Number(
                    row.count || 0
                );

            let lat =
                Number(
                    row.lat
                );

            let lng =
                Number(
                    row.long
                );

            if (
                !name ||
                !Number.isFinite(count)
            ) {

                return;

            }

            if (
                !Number.isFinite(lat)
            ) {

                lat =
                    null;

            }

            if (
                !Number.isFinite(lng)
            ) {

                lng =
                    null;

            }

            const resolution =
                resolveMunicipality(

                    name,

                    lat,

                    lng

                );

            if (
                !resolution.city
            ) {

                console.warn(

                    "Could not resolve municipality:",

                    {
                        name,

                        count,

                        lat,

                        lng
                    }

                );

                return;

            }

            const city =
                resolution.city;

            /* ---------------------------------------------
               Municipality total
               --------------------------------------------- */

            municipalityTotals[city] +=
                count;

            /* ---------------------------------------------
               Exact district
               --------------------------------------------- */

            const exactDistrict =
                districtToCity[name];

            if (
                exactDistrict
            ) {

                districtCounts[
                    exactDistrict
                ] = {

                    count,

                    lat,

                    long:
                        lng
                };

            }

            /* ---------------------------------------------
               Normalized lookup
               --------------------------------------------- */

            districtNameLookup[
                districtLookupKey(
                    name
                )
            ] = {

                name,

                city,

                count
            };

            /* ---------------------------------------------
               Keep row
               --------------------------------------------- */

            municipalityIncidentRows[city]
                .push({

                    name,

                    count,

                    lat,

                    lng,

                    displayLat:
                        lat,

                    displayLng:
                        lng,

                    city,

                    method:
                        resolution.method

                });

        }
    );

    /* =====================================================
       DISTRICT POLYGON TOOLTIP / STYLE UPDATE
       ===================================================== */

    Object.keys(
        districtLayers
    ).forEach(
        name => {

            const city =
                districtToCity[name];

            const layer =
                districtLayers[name];

            if (!layer) {

                return;

            }

            const count =
                getDistrictCount(
                    name
                );

            layer.setStyle(
                districtStyle(
                    city,
                    name
                )
            );

            layer.unbindTooltip();

            layer.bindTooltip(

                `
                <b>District:</b>
                ${name}
                <br>
                <b>Municipality:</b>
                ${city}
                <br>
                <b>Incidents:</b>
                ${Number(
                    count || 0
                ).toLocaleString()}
                `,

                {

                    sticky:
                        true,

                    direction:
                        "top",

                    opacity:
                        0.95,

                    className:
                        "custom-tooltip"
                }

            );

        }
    );

    /* =====================================================
       RESET VIEW
       ===================================================== */

    drillLevel =
        0;

    selectedMunicipality =
        null;

    selectedCluster =
        null;

    selectedSubCluster =
        null;

    currentClusters =
        [];

    showMunicipalityOverview();

}

/* =========================================================
   RECEIVE GRAFANA DATA
   ========================================================= */

window.addEventListener(

    "message",

    event => {

        if (
            event.data?.type !==
            "incidentData"
        ) {

            return;

        }

        const rows =
            event.data.data || [];

        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }

        applyIncidentData(
            rows
        );

    }

);

/* =========================================================
   EXTERNAL FUNCTIONS
   ========================================================= */

window.showMunicipalityOverview =
    showMunicipalityOverview;

window.showMunicipality =
    showMunicipality;

window.showSecondLevel =
    showSecondLevel;

window.showDistrictLevel =
    showDistrictLevel;

/* =========================================================
   FINAL SAFETY
   =========================================================

   Municipality boundaries are NEVER automatically hidden.

   ========================================================= */

console.log(
    "Municipality Incident Map — Optimized 3-Level Version"
);

console.log(
    "Dark colors:",
    {
        Low:
            DARK_GREEN,

        Medium:
            DARK_YELLOW,

        High:
            DARK_RED
    }
);

</script>

</body>
</html>
