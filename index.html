<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<title>Municipality Incident Heat Map</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.css"
/>

<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#map{

    width:100%;
    height:100vh;

}


/* =========================================================
   TITLE
   ========================================================= */

.map-title{

    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    background:rgba(255,255,255,.95);

    border:1px solid #333;

    border-radius:8px;

    padding:7px 16px;

    font-size:14px;

    font-weight:800;

    color:#111;

    box-shadow:
        0 2px 8px rgba(0,0,0,.25);

    pointer-events:none;

    white-space:nowrap;
}


/* =========================================================
   INFO
   ========================================================= */

.map-info{

    position:absolute;

    top:52px;
    left:50%;

    transform:translateX(-50%);

    z-index:9998;

    background:rgba(255,255,255,.94);

    border-radius:7px;

    padding:6px 12px;

    font-size:11px;

    color:#222;

    pointer-events:none;

    text-align:center;

    box-shadow:
        0 1px 6px rgba(0,0,0,.15);
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.map-back-button{

    background:#fff;

    border:1px solid #333;

    border-radius:7px;

    padding:7px 12px;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.3);

    margin-top:5px;
}

.map-back-button:hover{

    background:#f3f4f6;

}


/* =========================================================
   RISK LEGEND
   ========================================================= */

.risk-legend{

    background:rgba(255,255,255,.96);

    border:1px solid #333;

    border-radius:9px;

    padding:8px 11px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.28);

    color:#111;

    font-size:11px;

    min-width:130px;
}

.risk-legend-title{

    font-weight:800;

    font-size:12px;

    text-align:center;

    margin-bottom:6px;
}

.legend-row{

    display:flex;

    align-items:center;

    gap:7px;

    margin:4px 0;
}

.legend-color{

    width:16px;
    height:16px;

    border-radius:4px;

    display:inline-block;
}

.legend-green{

    background:#16a34a;
}

.legend-yellow{

    background:#facc15;
}

.legend-red{

    background:#dc2626;
}


/* =========================================================
   MUNICIPALITY / DISTRICT BORDERS
   IMPORTANT:
   NO FILLS
   ========================================================= */

.municipality-border{

    fill:none !important;

    fill-opacity:0 !important;

    stroke:#ffffff;

    stroke-width:2.5;

    stroke-opacity:.95;

    pointer-events:none;
}

.area-border{

    fill:none !important;

    fill-opacity:0 !important;

    stroke:#ffffff;

    stroke-width:1.5;

    stroke-opacity:.9;

}

.district-border{

    fill:none !important;

    fill-opacity:0 !important;

    stroke:#ffffff;

    stroke-width:1.3;

    stroke-opacity:.9;

}

.district-border:hover{

    stroke-width:2.5;

    stroke-opacity:1;
}


/* =========================================================
   TOOLTIP
   ========================================================= */

.leaflet-tooltip.custom-tooltip{

    background:rgba(255,255,255,.98);

    border:1px solid #222;

    border-radius:7px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.3);

    color:#111;

    padding:7px 9px;

    font-size:11px;

    line-height:1.5;

    font-weight:500;
}

.leaflet-tooltip.custom-tooltip b{

    font-weight:800;
}


/* =========================================================
   BUBBLE
   ========================================================= */

.count-bubble{

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    color:#fff;

    font-weight:800;

    border:2px solid rgba(255,255,255,.95);

    box-shadow:
        0 2px 7px rgba(0,0,0,.35);

    text-shadow:
        0 1px 2px rgba(0,0,0,.4);

    cursor:pointer;

    transition:
        transform .12s ease;
}

.count-bubble:hover{

    transform:scale(1.12);

    z-index:9999 !important;
}


/* Municipality */

.municipality-bubble{

    width:52px;
    height:52px;

    font-size:12px;
}


/* Area */

.area-bubble{

    width:42px;
    height:42px;

    font-size:10px;
}


/* District */

.district-bubble{

    width:34px;
    height:34px;

    font-size:9px;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10000;

    background:#fff;

    padding:12px 18px;

    border-radius:8px;

    border:1px solid #555;

    box-shadow:
        0 2px 10px rgba(0,0,0,.25);

    font-weight:700;
}


/* =========================================================
   LAYER CONTROL
   ========================================================= */

/*
   IMPORTANT:
   Large enough to click.
*/

.leaflet-control-layers{

    min-width:275px !important;

    max-width:320px !important;

    max-height:70vh !important;

    overflow-y:auto !important;

    overflow-x:hidden !important;

    background:rgba(255,255,255,.97) !important;

    border:1px solid #444 !important;

    border-radius:9px !important;

    box-shadow:
        0 3px 12px rgba(0,0,0,.3) !important;
}


/*
   Layer tree text
*/

.leaflet-control-layers-tree{

    padding:8px 10px !important;

    font-size:13px !important;
}


/*
   Each selectable row
*/

.leaflet-control-layers-tree label{

    display:flex !important;

    align-items:center !important;

    min-height:32px !important;

    padding:4px 5px !important;

    margin:2px 0 !important;

    cursor:pointer !important;

    user-select:none !important;

    border-radius:5px !important;
}

.leaflet-control-layers-tree label:hover{

    background:#f1f5f9 !important;
}


/*
   Checkbox
*/

.leaflet-control-layers-tree
input[type="checkbox"]{

    width:18px !important;

    height:18px !important;

    margin-right:8px !important;

    cursor:pointer !important;

    flex-shrink:0 !important;
}


/*
   Radio
*/

.leaflet-control-layers-tree
input[type="radio"]{

    width:17px !important;

    height:17px !important;

    margin-right:8px !important;

    cursor:pointer !important;
}


/*
   Text
*/

.leaflet-control-layers-tree span{

    font-size:13px !important;

    line-height:1.35 !important;

    cursor:pointer !important;
}


/*
   Nested items
*/

.leaflet-control-layers-tree ul{

    margin-left:14px !important;

    padding-left:8px !important;
}


/*
   Arrow button
*/

.leaflet-control-layers-tree
.leaflet-layerstree-expand-collapse{

    width:28px !important;

    height:28px !important;

    display:inline-flex !important;

    align-items:center !important;

    justify-content:center !important;

    font-size:16px !important;

    cursor:pointer !important;

    flex-shrink:0 !important;
}


/*
   Layer toggle button
*/

.leaflet-control-layers-toggle{

    width:42px !important;

    height:42px !important;

    background-size:25px 25px !important;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .map-title{

        font-size:11px;

        padding:6px 10px;
    }

    .map-info{

        font-size:9px;

        top:47px;
    }

    .risk-legend{

        min-width:115px;

        font-size:10px;
    }

    .municipality-bubble{

        width:48px;
        height:48px;

        font-size:11px;
    }

    .area-bubble{

        width:39px;
        height:39px;

        font-size:9px;
    }

    .district-bubble{

        width:31px;
        height:31px;

        font-size:8px;
    }

    .leaflet-control-layers{

        min-width:245px !important;

        max-width:285px !important;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="map-title">
    Municipality Incident Heat Map
</div>


<div
    id="map-info"
    class="map-info"
>
    Loading map…
</div>


<div
    id="loading"
    class="loading"
>
    Loading GeoJSON…
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js"></script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CITIES = [
    "Dammam",
    "Dhahran",
    "Khobar"
];


const GEOJSON_PATHS = {

    municipality:
        "./municipality.geojson",

    Dammam:
        "./dammam.geojson",

    Dhahran:
        "./dhahran.geojson",

    Khobar:
        "./khobar.geojson"
};


/* =========================================================
   COLORS
   ========================================================= */

const LOW_COLOR =
    "#16a34a";

const MID_COLOR =
    "#facc15";

const HIGH_COLOR =
    "#dc2626";

const NO_DATA_COLOR =
    "#94a3b8";


/* =========================================================
   MAP
   ========================================================= */

const map =
    L.map(
        "map",
        {
            maxZoom:19,

            zoomControl:true,

            preferCanvas:true,

            zoomSnap:.25,

            zoomDelta:.5
        }
    );


/* =========================================================
   OSM DEFAULT
   ========================================================= */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors",

            maxZoom:19,

            updateWhenIdle:true,

            keepBuffer:2
        }
    ).addTo(map);


/* =========================================================
   SATELLITE
   ========================================================= */

const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution:
                "Tiles &copy; Esri",

            maxZoom:19,

            updateWhenIdle:true,

            keepBuffer:2
        }
    );


/* =========================================================
   STATE
   ========================================================= */

let drillLevel = 0;

/*
  0 = Municipalities
  1 = 5 Areas
  2 = Districts
*/

let selectedMunicipality = null;

let selectedArea = null;

let areaGroups = [];


/* =========================================================
   DATA
   ========================================================= */

const municipalityBoundaryFeatures = {

    Dammam:[],
    Dhahran:[],
    Khobar:[]
};


const municipalityBoundaryLayers = {};

const municipalityCenters = {};

const municipalityTotals = {

    Dammam:0,
    Dhahran:0,
    Khobar:0
};


const municipalityIncidentRows = {

    Dammam:[],
    Dhahran:[],
    Khobar:[]
};


const districtToCity = {};

const districtFeatureByName = {};

const districtNameLookup = {};


/* =========================================================
   ACTIVE LAYERS
   ========================================================= */

const municipalityBubbleLayer =
    L.layerGroup().addTo(map);


const municipalityBorderLayer =
    L.layerGroup().addTo(map);


const areaLayer =
    L.layerGroup().addTo(map);


const areaBubbleLayer =
    L.layerGroup().addTo(map);


const districtLayer =
    L.layerGroup().addTo(map);


const districtBubbleLayer =
    L.layerGroup().addTo(map);


/* =========================================================
   FLAGS
   ========================================================= */

let mapReady = false;

let pendingIncidentData = null;


/* =========================================================
   HELPERS
   ========================================================= */

function number(value){

    const n =
        Number(
            String(value ?? "")
                .replace(/,/g,"")
        );

    return Number.isFinite(n)
        ? n
        : 0;
}


function formatNumber(value){

    return number(value)
        .toLocaleString("en-US");
}


function normalizeName(value){

    return String(value || "")
        .trim()
        .replace(/\s+/g," ")
        .toLowerCase()
        .replace(/[‐-‒–—―]/g,"-");
}


function normalizeArabic(value){

    return String(value || "")
        .trim()
        .replace(/[\u064B-\u065F\u0670]/g,"")
        .replace(/[أإآ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")
        .replace(/\s+/g," ");
}


function districtKey(value){

    return normalizeArabic(
        normalizeName(value)
    );
}


function getFeatureName(feature){

    return String(

        feature?.properties?.REMARKS ||

        feature?.properties?.NameEn ||

        feature?.properties?.NAME ||

        feature?.properties?.name ||

        feature?.properties?.Name ||

        ""

    ).trim();
}


/* =========================================================
   MUNICIPALITY NAME
   ========================================================= */

function municipalityFromName(name){

    const n =
        normalizeName(name);

    const a =
        normalizeArabic(name);


    if(
        n === "dammam" ||
        a === "الدمام"
    ){

        return "Dammam";
    }


    if(
        n === "dhahran" ||
        a === "الظهران"
    ){

        return "Dhahran";
    }


    if(
        n === "khobar" ||
        n === "al khobar" ||
        a === "الخبر"
    ){

        return "Khobar";
    }


    return null;
}


/* =========================================================
   POINT IN POLYGON
   ========================================================= */

function pointInRing(
    lat,
    lng,
    ring
){

    if(
        !ring ||
        ring.length < 3
    ){

        return false;
    }


    let inside = false;


    for(
        let i=0,
        j=ring.length-1;

        i<ring.length;

        j=i++
    ){

        const lngI =
            Number(ring[i][0]);

        const latI =
            Number(ring[i][1]);

        const lngJ =
            Number(ring[j][0]);

        const latJ =
            Number(ring[j][1]);


        const hit =
            ((latI > lat) !== (latJ > lat)) &&

            (
                lng <
                (
                    (lngJ-lngI) *
                    (lat-latI) /
                    ((latJ-latI) || 1e-12)
                ) +
                lngI
            );


        if(hit){

            inside = !inside;
        }
    }


    return inside;
}


function pointInPolygon(
    lat,
    lng,
    coords
){

    if(
        !coords ||
        !coords.length
    ){

        return false;
    }


    if(
        !pointInRing(
            lat,
            lng,
            coords[0]
        )
    ){

        return false;
    }


    for(
        let i=1;

        i<coords.length;

        i++
    ){

        if(
            pointInRing(
                lat,
                lng,
                coords[i]
            )
        ){

            return false;
        }
    }


    return true;
}


function pointInGeometry(
    lat,
    lng,
    geometry
){

    if(
        !geometry ||
        !geometry.coordinates
    ){

        return false;
    }


    if(
        geometry.type ===
        "Polygon"
    ){

        return pointInPolygon(
            lat,
            lng,
            geometry.coordinates
        );
    }


    if(
        geometry.type ===
        "MultiPolygon"
    ){

        return geometry.coordinates.some(
            polygon =>
                pointInPolygon(
                    lat,
                    lng,
                    polygon
                )
        );
    }


    return false;
}


/* =========================================================
   MUNICIPALITY RESOLUTION
   ========================================================= */

function resolveMunicipalityByCoordinates(
    lat,
    lng
){

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return null;
    }


    for(
        const city of CITIES
    ){

        const features =
            municipalityBoundaryFeatures[city] || [];


        for(
            const feature of features
        ){

            if(
                pointInGeometry(
                    lat,
                    lng,
                    feature.geometry
                )
            ){

                return city;
            }
        }
    }


    return null;
}


function distanceSquared(
    lat1,
    lng1,
    lat2,
    lng2
){

    const dx =
        (lng1-lng2) *
        Math.cos(
            (
                (lat1+lat2)/2
            ) *
            Math.PI/180
        );


    const dy =
        lat1-lat2;


    return dx*dx + dy*dy;
}


function resolveMunicipalityFallback(
    lat,
    lng
){

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return null;
    }


    let best = null;

    let bestDistance =
        Infinity;


    CITIES.forEach(
        city => {

            const center =
                municipalityCenters[city];


            if(!center){

                return;
            }


            const d =
                distanceSquared(
                    lat,
                    lng,
                    center.lat,
                    center.long
                );


            if(d < bestDistance){

                bestDistance = d;

                best = city;
            }
        }
    );


    return best;
}


function resolveMunicipality(
    name,
    lat,
    lng
){

    const clean =
        String(name || "")
            .trim();


    const exact =
        districtToCity[clean];


    if(exact){

        return exact;
    }


    const normalized =
        districtNameLookup[
            districtKey(clean)
        ];


    if(
        normalized &&
        normalized.city
    ){

        return normalized.city;
    }


    const boundary =
        resolveMunicipalityByCoordinates(
            lat,
            lng
        );


    if(boundary){

        return boundary;
    }


    return resolveMunicipalityFallback(
        lat,
        lng
    );
}


/* =========================================================
   FALLBACK COORDINATE
   ========================================================= */

function fallbackCoordinate(
    city,
    index,
    total
){

    const center =
        municipalityCenters[city];


    if(!center){

        return null;
    }


    const angle =
        (
            index /
            Math.max(total,1)
        ) *
        Math.PI *
        2;


    const radius =
        .008;


    return {

        lat:
            center.lat +
            Math.sin(angle) *
            radius,

        lng:
            center.long +
            Math.cos(angle) *
            radius
    };
}


/* =========================================================
   RISK
   ========================================================= */

function calculateRiskStats(
    items
){

    const values =
        (items || [])

            .map(
                x =>
                    number(x.count)
            )

            .filter(
                x => x > 0
            );


    if(!values.length){

        return {

            min:0,
            max:0,
            lowLimit:0,
            highLimit:0
        };
    }


    const min =
        Math.min(...values);


    const max =
        Math.max(...values);


    if(min === max){

        return {

            min,
            max,
            lowLimit:min,
            highLimit:min
        };
    }


    const range =
        max-min;


    return {

        min,
        max,

        lowLimit:
            min + range*.33,

        highLimit:
            min + range*.66
    };
}


function getRisk(
    count,
    stats
){

    count =
        number(count);


    if(count <= 0){

        return {

            level:"No Data",

            color:NO_DATA_COLOR
        };
    }


    if(
        !stats ||
        stats.max <= 0
    ){

        return {

            level:"No Data",

            color:NO_DATA_COLOR
        };
    }


    if(
        stats.max === stats.min
    ){

        return {

            level:"Low",

            color:LOW_COLOR
        };
    }


    if(
        count >= stats.highLimit
    ){

        return {

            level:"High",

            color:HIGH_COLOR
        };
    }


    if(
        count >= stats.lowLimit
    ){

        return {

            level:"Medium",

            color:MID_COLOR
        };
    }


    return {

        level:"Low",

        color:LOW_COLOR
    };
}


/* =========================================================
   UPDATE INFO
   ========================================================= */

function updateInfo(html){

    const el =
        document.getElementById(
            "map-info"
        );


    if(el){

        el.innerHTML = html;
    }
}


/* =========================================================
   CLEAR ALL DRILL LAYERS
   ========================================================= */

function clearDrillLayers(){

    municipalityBubbleLayer
        .clearLayers();

    municipalityBorderLayer
        .clearLayers();

    areaLayer
        .clearLayers();

    areaBubbleLayer
        .clearLayers();

    districtLayer
        .clearLayers();

    districtBubbleLayer
        .clearLayers();
}


/* =========================================================
   MUNICIPALITY BOUNDARY
   ONLY BORDER
   ========================================================= */

function addMunicipalityBoundary(
    feature,
    city
){

    const layer =
        L.geoJSON(
            feature,
            {
                className:
                    "municipality-border",

                style:{

                    color:"#ffffff",

                    weight:2.5,

                    opacity:.95,

                    fill:false,

                    fillOpacity:0
                }
            }
        );


    layer.bindTooltip(

        function(){

            return `
                <b>Municipality:</b>
                ${city}

                <br>

                <b>Total Incidents:</b>
                ${formatNumber(
                    municipalityTotals[city]
                )}

                <br><br>

                <b>Click to drill down</b>
            `;
        },

        {

            sticky:true,

            direction:"top",

            className:
                "custom-tooltip",

            offset:
                [0,-5]
        }
    );


    layer.on(
        "click",
        function(){

            selectMunicipality(
                city
            );
        }
    );


    municipalityBoundaryLayers[city] =
        municipalityBoundaryLayers[city] ||
        L.layerGroup();


    municipalityBoundaryLayers[city]
        .addLayer(layer);


    const center =
        layer
            .getBounds()
            .getCenter();


    municipalityCenters[city] = {

        lat:center.lat,

        long:center.lng
    };


    return layer;
}


/* =========================================================
   MUNICIPALITY BUBBLE
   ========================================================= */

function createBubble(
    lat,
    lng,
    count,
    color,
    className
){

    const icon =
        L.divIcon({

            className:"",

            html:
                `
                <div
                    class="count-bubble ${className}"
                    style="background:${color};"
                >
                    ${formatNumber(count)}
                </div>
                `,

            iconSize:null,

            iconAnchor:null
        });


    return L.marker(
        [lat,lng],
        {
            icon,

/* =========================================================
   MUNICIPALITY OVERVIEW
   ========================================================= */

function showMunicipalityOverview(){

    drillLevel = 0;

    selectedMunicipality = null;

    selectedArea = null;

    areaGroups = [];


    clearDrillLayers();


    /*
       IMPORTANT:
       Only municipality layer is shown.
    */

    CITIES.forEach(
        city => {

            const total =
                municipalityTotals[city] || 0;


            const rows =
                municipalityIncidentRows[city] || [];


            const stats =
                calculateRiskStats(
                    CITIES.map(
                        c => ({
                            count:
                                municipalityTotals[c]
                        })
                    )
                );


            const risk =
                getRisk(
                    total,
                    stats
                );


            const center =
                municipalityCenters[city];


            if(!center){

                return;
            }


            /*
               Municipality border
            */

            const boundary =
                municipalityBoundaryLayers[city];


            if(boundary){

                boundary.eachLayer(
                    layer => {

                        municipalityBorderLayer
                            .addLayer(layer);
                    }
                );
            }


            /*
               Municipality number
            */

            const bubble =
                createBubble(
                    center.lat,
                    center.long,
                    total,
                    risk.color,
                    "municipality-bubble"
                );


            bubble.bindTooltip(

                `
                <b>Municipality:</b>
                ${city}

                <br>

                <b>Total Incidents:</b>
                ${formatNumber(total)}

                <br>

                <b>Risk:</b>
                ${risk.level}

                <br><br>

                <b>Click to drill down</b>
                `,

                {

                    direction:"top",

                    sticky:true,

                    className:
                        "custom-tooltip",

                    offset:
                        [0,-12]
                }
            );


            bubble.on(
                "click",
                function(){

                    selectMunicipality(
                        city
                    );
                }
            );


            municipalityBubbleLayer
                .addLayer(bubble);
        }
    );


    /*
       Zoom a little closer than before.
    */

    const bounds =
        L.featureGroup(
            CITIES
                .map(
                    c =>
                        municipalityBoundaryLayers[c]
                )
                .filter(Boolean)
        ).getBounds();


    if(
        bounds &&
        bounds.isValid()
    ){

        map.fitBounds(
            bounds,
            {

                padding:
                    [45,45],

                maxZoom:11.5,

                animate:false
            }
        );
    }


    updateInfo(
        "🟢 Low &nbsp; 🟡 Medium &nbsp; 🔴 High &nbsp; | &nbsp; Click a municipality to drill down"
    );


    updateBackButton();
}


/* =========================================================
   SELECT MUNICIPALITY
   ========================================================= */

function selectMunicipality(
    city
){

    selectedMunicipality =
        city;


    selectedArea = null;

    drillLevel = 1;


    /*
       IMPORTANT:
       Remove ALL municipality overview
       bubbles and borders.
    */

    municipalityBubbleLayer
        .clearLayers();

    municipalityBorderLayer
        .clearLayers();

    areaLayer
        .clearLayers();

    areaBubbleLayer
        .clearLayers();

    districtLayer
        .clearLayers();

    districtBubbleLayer
        .clearLayers();


    /*
       ONLY selected municipality rows.
    */

    const rows =
        (
            municipalityIncidentRows[city] ||
            []
        ).map(
            (r,index) => {

                let lat =
                    Number(r.lat);

                let lng =
                    Number(r.lng);


                if(
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lng)
                ){

                    const fallback =
                        fallbackCoordinate(
                            city,
                            index,
                            municipalityIncidentRows[city].length
                        );


                    if(fallback){

                        lat =
                            fallback.lat;

                        lng =
                            fallback.lng;
                    }
                }


                return {

                    ...r,

                    lat,

                    lng,

                    city
                };
            }
        );


    /*
       Create 5 geographic groups.
    */

    areaGroups =
        createGroups(
            rows,
            5
        );


    /*
       IMPORTANT:
       NO municipality background
       at Level 2.
    */

    drawAreaBorders(
        city,
        areaGroups
    );


    drawAreaBubbles(
        city,
        areaGroups
    );


    /*
       Zoom into selected municipality.
    */

    const boundary =
        municipalityBoundaryLayers[city];


    if(
        boundary &&
        boundary.getBounds().isValid()
    ){

        map.fitBounds(
            boundary.getBounds(),
            {

                padding:
                    [35,35],

                maxZoom:13,

                animate:true
            }
        );
    }


    /*
       Send municipality filter to Grafana.
    */

    sendGrafanaSelection(
        null,
        city
    );


    updateInfo(
        `<b>${city}</b> → <b>${areaGroups.length} Areas</b>`
    );


    updateBackButton();
}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceSquaredPoints(
    a,
    b
){

    const dx =
        (
            a.lng-b.lng
        ) *
        Math.cos(
            (
                (a.lat+b.lat)/2
            ) *
            Math.PI/180
        );


    const dy =
        a.lat-b.lat;


    return dx*dx + dy*dy;
}


/* =========================================================
   WEIGHTED CENTROID
   ========================================================= */

function weightedCentroid(
    rows
){

    let sx=0;

    let sy=0;

    let sw=0;


    rows.forEach(
        r => {

            const weight =
                Math.max(
                    1,
                    number(r.count)
                );


            sx +=
                r.lat *
                weight;


            sy +=
                r.lng *
                weight;


            sw +=
                weight;
        }
    );


    if(!sw){

        return null;
    }


    return {

        lat:sx/sw,

        lng:sy/sw
    };
}


/* =========================================================
   CREATE SEEDS
   ========================================================= */

function chooseSeeds(
    rows,
    k
){

    if(rows.length <= k){

        return rows.map(
            r => ({
                lat:r.lat,
                lng:r.lng
            })
        );
    }


    const seeds = [];


    /*
       Highest incident point
       first.
    */

    let first =
        rows.reduce(
            (a,b) =>
                number(b.count) >
                number(a.count)
                    ? b
                    : a,
            rows[0]
        );


    seeds.push({

        lat:first.lat,

        lng:first.lng
    });


    while(
        seeds.length < k
    ){

        let best = null;

        let bestScore = -1;


        rows.forEach(
            r => {

                let minDistance =
                    Infinity;


                seeds.forEach(
                    s => {

                        const d =
                            distanceSquaredPoints(
                                r,
                                s
                            );


                        if(
                            d <
                            minDistance
                        ){

                            minDistance =
                                d;
                        }
                    }
                );


                const score =
                    minDistance *
                    (
                        1 +
                        Math.sqrt(
                            Math.max(
                                0,
                                number(r.count)
                            )
                        )
                    );


                if(
                    score >
                    bestScore
                ){

                    bestScore =
                        score;

                    best = r;
                }
            }
        );


        if(best){

            seeds.push({

                lat:best.lat,

                lng:best.lng
            });
        }
    }


    return seeds;
}


/* =========================================================
   GROUP DATA
   ========================================================= */

function createGroups(
    rows,
    k
){

    if(!rows.length){

        return [];
    }


    k =
        Math.min(
            k,
            rows.length
        );


    const seeds =
        chooseSeeds(
            rows,
            k
        );


    for(
        let iteration=0;

        iteration<7;

        iteration++
    ){

        const groups =
            seeds.map(
                () => []
            );


        rows.forEach(
            r => {

                let bestIndex=0;

                let bestDistance=
                    Infinity;


                seeds.forEach(
                    (seed,i) => {

                        const d =
                            distanceSquaredPoints(
                                r,
                                seed
                            );


                        if(
                            d <
                            bestDistance
                        ){

                            bestDistance=d;

                            bestIndex=i;
                        }
                    }
                );


                groups[
                    bestIndex
                ].push(r);
            }
        );


        groups.forEach(
            (group,i) => {

                const center =
                    weightedCentroid(
                        group
                    );


                if(center){

                    seeds[i] =
                        center;
                }
            }
        );
    }


    const finalGroups =
        seeds.map(
            (seed,index) => ({

                index,

                seed,

                items:[]
            })
        );


    rows.forEach(
        r => {

            let bestIndex=0;

            let bestDistance=
                Infinity;


            seeds.forEach(
                (seed,i) => {

                    const d =
                        distanceSquaredPoints(
                            r,
                            seed
                        );


                    if(
                        d <
                        bestDistance
                    ){

                        bestDistance=d;

                        bestIndex=i;
                    }
                }
            );


            finalGroups[
                bestIndex
            ].items.push(r);
        }
    );


    return finalGroups
        .filter(
            g =>
                g.items.length
        );
}


/* =========================================================
   AREA BORDERS
   IMPORTANT:
   NO FILLED BACKGROUND
   ========================================================= */

function drawAreaBorders(
    city,
    groups
){

    /*
       We intentionally do NOT
       draw colored area polygons.

       Only small border lines are
       shown around district geometry
       when we reach Level 3.
    */

    areaLayer.clearLayers();
}


/* =========================================================
   AREA BUBBLES
   ========================================================= */

function drawAreaBubbles(
    city,
    groups
){

    areaBubbleLayer
        .clearLayers();


    const stats =
        calculateRiskStats(
            groups.map(
                g => ({

                    count:
                        g.items.reduce(
                            (sum,r) =>
                                sum +
                                number(r.count),
                            0
                        )
                })
            )
        );


    groups.forEach(
        group => {

            const total =
                group.items.reduce(
                    (sum,r) =>
                        sum +
                        number(r.count),
                    0
                );


            const risk =
                getRisk(
                    total,
                    stats
                );


            const center =
                weightedCentroid(
                    group.items
                ) ||
                group.seed;


            const bubble =
                createBubble(
                    center.lat,
                    center.lng,
                    total,
                    risk.color,
                    "area-bubble"
                );


            bubble.bindTooltip(

                `
                <b>${city}</b>

                <br>

                <b>Area:</b>
                ${group.index+1}

                <br>

                <b>Total Incidents:</b>
                ${formatNumber(total)}

                <br>

                <b>Districts:</b>
                ${group.items.length}

                <br>

                <b>Risk:</b>
                ${risk.level}

                <br><br>

                <b>Click to show districts</b>
                `,

                {

                    direction:"top",

                    sticky:true,

                    className:
                        "custom-tooltip",

                    offset:
                        [0,-10]
                }
            );


            bubble.on(
                "click",
                function(){

                    showDistrictLevel(
                        group,
                        city
                    );
                }
            );


            areaBubbleLayer
                .addLayer(bubble);
        }
    );


    /*
       Zoom selected municipality
       a little closer.
    */

    const points =
        groups.flatMap(
            g =>
                g.items
                    .filter(
                        r =>
                            Number.isFinite(r.lat) &&
                            Number.isFinite(r.lng)
                    )
                    .map(
                        r =>
                            [
                                r.lat,
                                r.lng
                            ]
                    )
        );


    if(points.length){

        map.fitBounds(
            L.latLngBounds(points),
            {

                padding:
                    [55,55],

                maxZoom:14,

                animate:true
            }
        );
    }
}


/* =========================================================
   DISTRICT LEVEL
   IMPORTANT:
   ONLY BORDER + BUBBLES
   NO FILLED POLYGON
   ========================================================= */

function showDistrictLevel(
    group,
    city
){

    selectedArea =
        group;

    drillLevel = 2;


    /*
       Remove Level 2 bubbles.
    */

    areaBubbleLayer
        .clearLayers();

    areaLayer
        .clearLayers();


    districtLayer
        .clearLayers();

    districtBubbleLayer
        .clearLayers();


    const rows =
        group.items || [];


    const stats =
        calculateRiskStats(
            rows
        );


    rows.forEach(
        row => {

            const key =
                districtKey(
                    row.name
                );


            const feature =
                districtFeatureByName[key];


            /*
               District border
               only.
            */

            if(feature){

                const risk =
                    getRisk(
                        row.count,
                        stats
                    );


                const border =
                    L.geoJSON(
                        feature,
                        {

                            className:
                                "district-border",

                            style:{

                                color:"#ffffff",

                                weight:1.3,

                                opacity:.9,

                                fill:false,

                                fillOpacity:0
                            }
                        }
                    );


                border.bindTooltip(

                    `
                    <b>District:</b>
                    ${row.name}

                    <br>

                    <b>Municipality:</b>
                    ${city}

                    <br>

                    <b>Incidents:</b>
                    ${formatNumber(row.count)}

                    <br>

                    <b>Risk:</b>
                    ${risk.level}
                    `,

                    {

                        sticky:true,

                        direction:"top",

                        className:
                            "custom-tooltip",

                        offset:
                            [0,-5]
                    }
                );


                border.on(
                    "mouseover",
                    function(){

                        border.setStyle({

                            weight:2.4,

                            opacity:1
                        });
                    }
                );


                border.on(
                    "mouseout",
                    function(){

                        border.setStyle({

                            weight:1.3,

                            opacity:.9
                        });
                    }
                );


                border.on(
                    "click",
                    function(){

                        selectDistrict(
                            row,
                            city
                        );
                    }
                );


                districtLayer
                    .addLayer(
                        border
                    );
            }


            /*
               District count bubble.
            */

            if(
                Number.isFinite(row.lat) &&
                Number.isFinite(row.lng)
            ){

                const risk =
                    getRisk(
                        row.count,
                        stats
                    );


                const bubble =
                    createBubble(
                        row.lat,
                        row.lng,
                        row.count,
                        risk.color,
                        "district-bubble"
                    );


                bubble.bindTooltip(

                    `
                    <b>District:</b>
                    ${row.name}

                    <br>

                    <b>Municipality:</b>
                    ${city}

                    <br>

                    <b>Incidents:</b>
                    ${formatNumber(row.count)}

                    <br>

                    <b>Risk:</b>
                    ${risk.level}

                    <br><br>

                    <b>Click to filter</b>
                    `,

                    {

                        direction:"top",

                        sticky:true,

                        className:
                            "custom-tooltip",

                        offset:
                            [0,-8]
                    }
                );


                bubble.on(
                    "click",
                    function(){

                        selectDistrict(
                            row,
                            city
                        );
                    }
                );


                districtBubbleLayer
                    .addLayer(
                        bubble
                    );
            }
        }
    );


    /*
       Zoom closer.
    */

    const points =
        rows
            .filter(
                r =>
                    Number.isFinite(r.lat) &&
                    Number.isFinite(r.lng)
            )
            .map(
                r =>
                    [
                        r.lat,
                        r.lng
                    ]
            );


    if(points.length){

        map.fitBounds(
            L.latLngBounds(points),
            {

                padding:
                    [65,65],

                maxZoom:16,

                animate:true
            }
        );
    }
    else{

        const boundary =
            municipalityBoundaryLayers[
                city
            ];


        if(
            boundary &&
            boundary.getBounds().isValid()
        ){

            map.fitBounds(
                boundary.getBounds(),
                {

                    padding:
                        [50,50],

                    maxZoom:15,

                    animate:true
                }
            );
        }
    }


    updateInfo(

        `<b>${city}</b> → ` +

        `<b>Area ${group.index+1}</b> → ` +

        `<b>Districts</b>`

    );


    updateBackButton();
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

const backControl =
    L.control({
        position:"topright"
    });


backControl.onAdd =
    function(){

        const div =
            L.DomUtil.create(
                "div",
                "map-back-button"
            );


        div.innerHTML =
            "← Back";


        div.style.display =
            "none";


        L.DomEvent
            .disableClickPropagation(
                div
            );


        div.addEventListener(
            "click",
            handleBack
        );


        backControl._button =
            div;


        return div;
    };


backControl.addTo(map);


/* =========================================================
   UPDATE BACK BUTTON
   ========================================================= */

function updateBackButton(){

    const button =
        backControl._button;


    if(!button){

        return;
    }


    if(
        drillLevel === 0
    ){

        button.style.display =
            "none";

        return;
    }


    button.style.display =
        "block";


    if(
        drillLevel === 1
    ){

        button.innerHTML =
            "← Municipalities";
    }
    else{

        button.innerHTML =
            "← Areas";
    }
}


/* =========================================================
   BACK
   ========================================================= */

function handleBack(){

    /*
       Level 3 -> Level 2
    */

    if(
        drillLevel === 2 &&
        selectedMunicipality
    ){

        sendGrafanaSelection(
            "All",
            selectedMunicipality
        );


        selectMunicipality(
            selectedMunicipality
        );


        return;
    }


    /*
       Level 2 -> Level 1
    */

    if(
        drillLevel === 1
    ){

        sendGrafanaSelection(
            "All",
            null
        );


        showMunicipalityOverview();


        return;
    }


    showMunicipalityOverview();
}

/* =========================================================
   LAYER TREE
   ========================================================= */

/*
   IMPORTANT:

   Initial state:
       Dammam
       Dhahran
       Khobar

   Children are NOT expanded.

   User must click the arrow.

   The tree also contains district names
   under each municipality.
*/


let layerTreeControl = null;


function buildLayerTree(){

    const municipalityNodes =
        CITIES.map(
            city => {

                /*
                   Get district names for
                   this municipality.
                */

                const districts =
                    Object.values(
                        districtNameLookup
                    )
                    .filter(
                        d =>
                            d.city === city
                    )
                    .map(
                        d => ({
                            label:
                                d.name,

                            layer:
                                L.layerGroup()
                        })
                    );


                return {

                    label:
                        `<b>${city}</b>`,

                    /*
                       IMPORTANT:
                       No layer attached to the
                       parent checkbox.

                       The municipality itself
                       is selected through the
                       label/click handler below.
                    */

                    children:
                        districts,

                    collapsed:true
                };
            }
        );


    const overlaysTree = {

        label:
            "<b>Municipalities</b>",

        selectAllCheckbox:false,

        children:
            municipalityNodes,

        collapsed:false
    };


    /*
       Base maps.
    */

    const baseTree = {

        label:
            "Base Map",

        children:[

            {

                label:
                    "OpenStreetMap",

                layer:
                    osm
            },

            {

                label:
                    "Satellite",

                layer:
                    satellite
            }
        ]
    };


    /*
       Remove previous control.
    */

    if(layerTreeControl){

        map.removeControl(
            layerTreeControl
        );
    }


    /*
       Create new tree.
    */

    layerTreeControl =
        L.control.layers.tree(

            baseTree,

            overlaysTree,

            {

                collapsed:true,

                namedToggle:false,

                selectorBack:false,

                closedSymbol:"▶",

                openedSymbol:"▼"
            }

        );


    layerTreeControl.addTo(map);


    /*
       IMPORTANT:
       Handle municipality text clicks
       without forcing children open.
    */

    setTimeout(
        attachMunicipalityTreeClicks,
        300
    );
}


/* =========================================================
   MUNICIPALITY TREE CLICK
   ========================================================= */

function attachMunicipalityTreeClicks(){

    const root =
        document.querySelector(
            ".leaflet-control-layers-tree"
        );


    if(!root){

        return;
    }


    const labels =
        root.querySelectorAll(
            "label"
        );


    labels.forEach(
        label => {

            const text =
                label.innerText
                    .trim();


            CITIES.forEach(
                city => {

                    if(
                        text === city
                    ){

                        label.onclick =
                            function(event){

                                /*
                                   If user clicked
                                   arrow, let plugin
                                   expand/collapse.
                                */

                                const target =
                                    event.target;


                                if(
                                    target &&
                                    (
                                        target.tagName ===
                                        "INPUT" ||

                                        target.classList.contains(
                                            "leaflet-layerstree-expand-collapse"
                                        )
                                    )
                                ){

                                    return;
                                }


                                selectMunicipality(
                                    city
                                );
                            };
                    }
                }
            );
        }
    );
}


/* =========================================================
   LOAD GEOJSON
   ========================================================= */

async function loadGeoJSON(){

    const loading =
        document.getElementById(
            "loading"
        );


    try{

        const responses =
            await Promise.all([

                fetch(
                    GEOJSON_PATHS.municipality
                ),

                fetch(
                    GEOJSON_PATHS.Dammam
                ),

                fetch(
                    GEOJSON_PATHS.Dhahran
                ),

                fetch(
                    GEOJSON_PATHS.Khobar
                )
            ]);


        for(
            const response of responses
        ){

            if(!response.ok){

                throw new Error(
                    "Failed to load " +
                    response.url +
                    " HTTP " +
                    response.status
                );
            }
        }


        const [

            municipalityData,

            dammamData,

            dhahranData,

            khobarData

        ] =
            await Promise.all(
                responses.map(
                    r =>
                        r.json()
                )
            );


        /* =================================================
           MUNICIPALITIES
           ================================================= */

        if(
            municipalityData &&
            Array.isArray(
                municipalityData.features
            )
        ){

            municipalityData.features.forEach(
                feature => {

                    const name =
                        getFeatureName(
                            feature
                        );


                    const city =
                        municipalityFromName(
                            name
                        );


                    if(!city){

                        return;
                    }


                    municipalityBoundaryFeatures[
                        city
                    ].push(
                        feature
                    );


                    addMunicipalityBoundary(
                        feature,
                        city
                    );
                }
            );
        }


        /* =================================================
           DISTRICTS
           ================================================= */

        registerDistricts(
            dammamData,
            "Dammam"
        );


        registerDistricts(
            dhahranData,
            "Dhahran"
        );


        registerDistricts(
            khobarData,
            "Khobar"
        );


        /*
           Build layer tree only AFTER
           districts have been loaded.

           This means the municipality
           children exist but remain
           collapsed.
        */

        buildLayerTree();


        mapReady = true;


        loading.style.display =
            "none";


        if(
            pendingIncidentData
        ){

            applyIncidentData(
                pendingIncidentData
            );


            pendingIncidentData =
                null;
        }
        else{

            showMunicipalityOverview();
        }


        window.parent.postMessage(

            {

                type:
                    "iframeReady"
            },

            "*"
        );


        setTimeout(
            () =>
                map.invalidateSize(
                    true
                ),
            250
        );

    }
    catch(error){

        console.error(
            "GeoJSON error:",
            error
        );


        loading.innerHTML =
            `
            GeoJSON load error.<br><br>

            <small>
            ${error.message}

            <br><br>

            Required files:

            <br>
            municipality.geojson

            <br>
            dammam.geojson

            <br>
            dhahran.geojson

            <br>
            khobar.geojson
            </small>
            `;
    }
}


/* =========================================================
   REGISTER DISTRICTS
   ========================================================= */

function registerDistricts(
    data,
    city
){

    if(
        !data ||
        !Array.isArray(
            data.features
        )
    ){

        return;
    }


    data.features.forEach(
        feature => {

            const name =
                getFeatureName(
                    feature
                );


            if(!name){

                return;
            }


            const key =
                districtKey(
                    name
                );


            districtToCity[
                name
            ] = city;


            districtNameLookup[
                key
            ] = {

                name,

                city,

                count:0
            };


            districtFeatureByName[
                key
            ] = feature;
        }
    );
}


/* =========================================================
   APPLY GRAFANA DATA
   ========================================================= */

function applyIncidentData(
    rows
){

    /*
       Clear old data.
    */

    CITIES.forEach(
        city => {

            municipalityTotals[
                city
            ] = 0;


            municipalityIncidentRows[
                city
            ] = [];
        }
    );


    Object.keys(
        districtNameLookup
    ).forEach(
        key => {

            if(
                districtNameLookup[key]
            ){

                districtNameLookup[
                    key
                ].count = 0;
            }
        }
    );


    /*
       Process rows.
    */

    (rows || []).forEach(
        row => {

            const name =
                String(
                    row.state || ""
                ).trim();


            const count =
                number(
                    row.count
                );


            let lat =
                Number(
                    row.lat
                );


            let lng =
                Number(
                    row.long
                );


            if(!name){

                return;
            }


            if(
                !Number.isFinite(lat)
            ){

                lat = null;
            }


            if(
                !Number.isFinite(lng)
            ){

                lng = null;
            }


            const city =
                resolveMunicipality(
                    name,
                    lat,
                    lng
                );


            if(!city){

                console.warn(
                    "Could not resolve municipality:",
                    name
                );

                return;
            }


            municipalityTotals[
                city
            ] += count;


            const key =
                districtKey(
                    name
                );


            if(
                districtNameLookup[key]
            ){

                districtNameLookup[
                    key
                ].count = count;
            }


            municipalityIncidentRows[
                city
            ].push({

                name,

                count,

                lat,

                lng,

                city
            });
        }
    );


    /*
       Add fallback coordinates.
    */

    CITIES.forEach(
        city => {

            const cityRows =
                municipalityIncidentRows[
                    city
                ];


            cityRows.forEach(
                (row,index) => {

                    if(
                        !Number.isFinite(
                            row.lat
                        ) ||
                        !Number.isFinite(
                            row.lng
                        )
                    ){

                        const fallback =
                            fallbackCoordinate(
                                city,
                                index,
                                cityRows.length
                            );


                        if(fallback){

                            row.lat =
                                fallback.lat;

                            row.lng =
                                fallback.lng;
                        }
                    }
                }
            );
        }
    );


    /*
       IMPORTANT:

       Do NOT force overview if
       user is already drilling down.

       Preserve current level.
    */

    if(
        drillLevel === 1 &&
        selectedMunicipality
    ){

        selectMunicipality(
            selectedMunicipality
        );

    }
    else if(
        drillLevel === 2 &&
        selectedMunicipality &&
        selectedArea
    ){

        /*
           Find same area again
           from updated data.
        */

        const cityRows =
            municipalityIncidentRows[
                selectedMunicipality
            ] || [];


        const groups =
            createGroups(
                cityRows,
                5
            );


        let matchingGroup =
            groups[
                selectedArea.index
            ];


        if(matchingGroup){

            areaGroups =
                groups;


            showDistrictLevel(
                matchingGroup,
                selectedMunicipality
            );
        }
        else{

            selectMunicipality(
                selectedMunicipality
            );
        }

    }
    else{

        showMunicipalityOverview();
    }


    setTimeout(
        () =>
            map.invalidateSize(
                true
            ),
        100
    );
}


/* =========================================================
   GRAFANA -> HTML
   ========================================================= */

window.addEventListener(
    "message",
    function(event){

        if(
            event.data?.type !==
            "incidentData"
        ){

            return;
        }


        const rows =
            Array.isArray(
                event.data.data
            )
                ? event.data.data
                : [];


        console.log(
            "Grafana incidentData:",
            rows
        );


        if(!mapReady){

            pendingIncidentData =
                rows;

            return;
        }


        applyIncidentData(
            rows
        );
    }
);


/* =========================================================
   INITIAL MAP POSITION
   ========================================================= */

map.setView(
    [26.42,50.10],
    10.5
);


/* =========================================================
   START
   ========================================================= */

loadGeoJSON();

</script>
