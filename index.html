<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Municipality Incident Map</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.css"
/>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#map {

    width: 100%;
    height: 100%;

    background: #f5f5f5;
}

/* =========================================================
   TITLE
   ========================================================= */

.map-title {

    position: absolute;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 1000;

    background: rgba(255,255,255,0.95);

    padding: 9px 22px;

    border-radius: 7px;

    font-size: 17px;
    font-weight: 700;

    color: #263238;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.18);

    pointer-events: none;

    white-space: nowrap;
}

/* =========================================================
   INFO PANEL
   ========================================================= */

.map-info {

    position: absolute;

    top: 62px;
    left: 12px;

    z-index: 1000;

    background: rgba(255,255,255,0.95);

    padding: 8px 13px;

    border-radius: 6px;

    font-size: 12px;

    color: #37474F;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.15);

    pointer-events: none;
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

.back-button {

    background: #ffffff;

    border: 1px solid #cfd8dc;

    border-radius: 5px;

    width: 34px;
    height: 34px;

    line-height: 31px;

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    color: #263238;

    cursor: pointer;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.18);
}

.back-button:hover {

    background: #f5f5f5;
}

/* =========================================================
   CUSTOM TOOLTIP
   ========================================================= */

.custom-tooltip {

    background: rgba(255,255,255,0.97);

    color: #263238;

    border: 1px solid #cfd8dc;

    border-radius: 6px;

    padding: 7px 10px;

    font-size: 12px;

    line-height: 1.45;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.18);
}

.custom-tooltip::before {

    border-top-color: #cfd8dc;
}

/* =========================================================
   COUNT BUBBLES
   ========================================================= */

.count-bubble-wrapper {

    background: transparent;

    border: none;

    pointer-events: auto;
}

.count-bubble {

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #ffffff;

    font-weight: 700;

    border: 2px solid rgba(255,255,255,0.95);

    box-shadow:
        0 2px 7px rgba(0,0,0,0.30);

    text-shadow:
        0 1px 2px rgba(0,0,0,0.45);

    cursor: pointer;

    box-sizing: border-box;
}

/* Municipality */

.count-bubble.municipality {

    width: 58px;
    height: 58px;

    font-size: 12px;
}

/* Group */

.count-bubble.group {

    width: 48px;
    height: 48px;

    font-size: 11px;
}

/* District */

.count-bubble.district {

    width: 40px;
    height: 40px;

    font-size: 10px;
}

/* =========================================================
   LEAFLET LAYER CONTROL
   ========================================================= */

.leaflet-control-layers {

    font-size: 12px;
}

.leaflet-control-layers-tree {

    line-height: 1.6;
}

/* =========================================================
   LEGEND
   ========================================================= */

.legend {

    position: absolute;

    bottom: 18px;
    left: 12px;

    z-index: 1000;

    background: rgba(255,255,255,0.96);

    padding: 9px 12px;

    border-radius: 6px;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.18);

    font-size: 11px;

    color: #263238;
}

.legend-title {

    font-weight: 700;

    margin-bottom: 6px;
}

.legend-row {

    display: flex;

    align-items: center;

    margin: 3px 0;
}

.legend-color {

    width: 14px;
    height: 14px;

    border-radius: 3px;

    margin-right: 6px;

    border: 1px solid rgba(0,0,0,0.10);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px) {

    .map-title {

        font-size: 14px;

        padding: 7px 14px;

        top: 8px;
    }

    .map-info {

        top: 50px;

        font-size: 10px;
    }

    .count-bubble.municipality {

        width: 50px;
        height: 50px;

        font-size: 10px;
    }

    .count-bubble.group {

        width: 43px;
        height: 43px;

        font-size: 9px;
    }

    .count-bubble.district {

        width: 36px;
        height: 36px;

        font-size: 8px;
    }
}

</style>

</head>


<body>

<div id="map"></div>

<div
    id="mapTitle"
    class="map-title">
    Municipality Incident Overview
</div>

<div
    id="mapInfo"
    class="map-info">
    LEVEL 1 — MUNICIPALITIES
</div>

<div class="legend">

    <div class="legend-title">
        Risk Level
    </div>

    <div class="legend-row">

        <span
            class="legend-color"
            style="background:#2E7D32;">
        </span>

        Low
    </div>

    <div class="legend-row">

        <span
            class="legend-color"
            style="background:#F9A825;">
        </span>

        Medium
    </div>

    <div class="legend-row">

        <span
            class="legend-color"
            style="background:#A61B1B;">
        </span>

        High
    </div>

    <div class="legend-row">

        <span
            class="legend-color"
            style="background:#64748B;">
        </span>

        No Data
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js"></script>


<script>

/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {

    zoomControl: true,

    preferCanvas: true

});


/* =========================================================
   BASE MAPS
   DEFAULT = OPEN STREET MAP
   ========================================================= */

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

);


const satellite = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 19,

        attribution:
            "Tiles &copy; Esri"

    }

);


/* DEFAULT MAP */

osm.addTo(map);


/* =========================================================
   CONSTANTS
   ========================================================= */

const CITIES = [

    "Dammam",
    "Dhahran",
    "Khobar"

];


const DARK_RED = "#A61B1B";

const GREEN = "#2E7D32";

const YELLOW = "#F9A825";

const NO_DATA = "#64748B";


/* =========================================================
   DATA STORES
   ========================================================= */

const districtCounts = {};

const districtToCity = {};

const districtNameLookup = {};

const districtLayers = {};

const municipalityBoundaryLayers = {};

const municipalityBoundaryFeatures = {};

const municipalityCenters = {};

const municipalityIncidentRows = {

    Dammam: [],
    Dhahran: [],
    Khobar: []

};

const municipalityTotals = {

    Dammam: 0,
    Dhahran: 0,
    Khobar: 0

};

const cityDistrictCache = {};

const cityGroupCache = {};


/* =========================================================
   STATE
   ========================================================= */

let drillLevel = 0;

let selectedMunicipality = null;

let selectedCluster = null;

let selectedDistrictName = null;

let currentClusters = [];


/* =========================================================
   VISUAL LAYERS
   ========================================================= */

const visualLayer = L.layerGroup().addTo(map);

const labelLayer = L.layerGroup().addTo(map);


/* =========================================================
   READY STATE
   ========================================================= */

let mapReady = false;

let pendingIncidentData = null;


/* =========================================================
   NORMALIZATION
   ========================================================= */

function normalizeName(name) {

    return String(name ?? "")

        .trim()

        .replace(/\s+/g, " ")

        .toLowerCase();

}


function normalizeArabic(name) {

    return String(name ?? "")

        .replace(/[إأآا]/g, "ا")

        .replace(/ى/g, "ي")

        .replace(/ة/g, "ه")

        .replace(/[ًٌٍَُِّْـ]/g, "")

        .replace(/\s+/g, " ")

        .trim();

}


function districtLookupKey(name) {

    return normalizeArabic(
        normalizeName(name)
    );

}


/* =========================================================
   DISTRICT COUNT
   ========================================================= */

function getDistrictCount(name) {

    if (!name) {

        return 0;

    }

    const key = districtLookupKey(name);

    if (districtNameLookup[key]) {

        return Number(
            districtNameLookup[key].count || 0
        );

    }

    if (districtCounts[name]) {

        return Number(
            districtCounts[name].count || 0
        );

    }

    return 0;

}


/* =========================================================
   POINT IN RING
   ========================================================= */

function pointInRing(point, ring) {

    const x = point[0];

    const y = point[1];

    let inside = false;

    for (
        let i = 0, j = ring.length - 1;
        i < ring.length;
        j = i++
    ) {

        const xi = ring[i][0];

        const yi = ring[i][1];

        const xj = ring[j][0];

        const yj = ring[j][1];

        const intersect =
            ((yi > y) !== (yj > y)) &&
            (
                x <
                (xj - xi) *
                (y - yi) /
                ((yj - yi) || 1e-12) +
                xi
            );

        if (intersect) {

            inside = !inside;

        }

    }

    return inside;

}


/* =========================================================
   POINT IN POLYGON
   ========================================================= */

function pointInPolygon(lng, lat, coordinates) {

    if (!coordinates || !coordinates.length) {

        return false;

    }

    if (
        pointInRing(
            [lng, lat],
            coordinates[0]
        )
    ) {

        let insideHole = false;

        for (
            let i = 1;
            i < coordinates.length;
            i++
        ) {

            if (
                pointInRing(
                    [lng, lat],
                    coordinates[i]
                )
            ) {

                insideHole = true;

                break;

            }

        }

        return !insideHole;

    }

    return false;

}


/* =========================================================
   POINT IN GEOMETRY
   ========================================================= */

function pointInGeometry(lng, lat, geometry) {

    if (!geometry) {

        return false;

    }

    if (
        geometry.type === "Polygon"
    ) {

        return pointInPolygon(
            lng,
            lat,
            geometry.coordinates
        );

    }

    if (
        geometry.type === "MultiPolygon"
    ) {

        return geometry.coordinates.some(
            polygon =>
                pointInPolygon(
                    lng,
                    lat,
                    polygon
                )
        );

    }

    return false;

}


/* =========================================================
   MUNICIPALITY RESOLUTION
   ========================================================= */

function resolveMunicipalityByCoordinates(
    lat,
    lng
) {

    for (const city of CITIES) {

        const features =
            municipalityBoundaryFeatures[city] || [];

        for (const feature of features) {

            if (
                pointInGeometry(
                    lng,
                    lat,
                    feature.geometry
                )
            ) {

                return city;

            }

        }

    }

    return null;

}


/* =========================================================
   FALLBACK MUNICIPALITY
   ========================================================= */

function resolveMunicipalityFallback(
    lat,
    lng
) {

    let bestCity = null;

    let bestDistance = Infinity;

    for (const city of CITIES) {

        const center =
            municipalityCenters[city];

        if (!center) {

            continue;

        }

        const dLat =
            Number(lat) -
            Number(center.lat);

        const dLng =
            Number(lng) -
            Number(center.long);

        const distance =
            dLat * dLat +
            dLng * dLng;

        if (
            distance < bestDistance
        ) {

            bestDistance = distance;

            bestCity = city;

        }

    }

    return bestCity;

}


/* =========================================================
   MUNICIPALITY RESOLUTION
   ========================================================= */

function resolveMunicipality(
    name,
    lat,
    lng
) {

    const cleanName =
        String(name ?? "").trim();


    if (
        districtToCity[cleanName]
    ) {

        return districtToCity[cleanName];

    }


    const key =
        districtLookupKey(cleanName);


    if (
        districtNameLookup[key]
    ) {

        return districtNameLookup[key].city;

    }


    if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
    ) {

        const byGeometry =
            resolveMunicipalityByCoordinates(
                lat,
                lng
            );

        if (byGeometry) {

            return byGeometry;

        }

        return resolveMunicipalityFallback(
            lat,
            lng
        );

    }


    return null;

}


/* =========================================================
   RISK COLOR
   UNIQUE POSITIVE VALUES
   ========================================================= */

function getRankedColor(
    count,
    rows
) {

    const value =
        Number(count || 0);


    if (
        value <= 0
    ) {

        return NO_DATA;

    }


    const values =
        rows

            .map(r =>
                Number(r.count || 0)
            )

            .filter(v => v > 0);


    const uniqueValues =
        [...new Set(values)]
            .sort(
                (a, b) => a - b
            );


    if (
        uniqueValues.length === 0
    ) {

        return GREEN;

    }


    if (
        uniqueValues.length === 1
    ) {

        return GREEN;

    }


    const rank =
        uniqueValues.indexOf(value);


    if (
        uniqueValues.length === 2
    ) {

        return rank === 1
            ? DARK_RED
            : GREEN;

    }


    const n =
        uniqueValues.length;


    if (
        rank < n / 3
    ) {

        return GREEN;

    }


    if (
        rank >= (2 * n) / 3
    ) {

        return DARK_RED;

    }


    return YELLOW;

}


/* =========================================================
   MUNICIPALITY COLOR
   ========================================================= */

function getMunicipalityColor(city) {

    const rows =
        CITIES.map(
            c => ({
                count:
                    municipalityTotals[c]
            })
        );


    return getRankedColor(
        municipalityTotals[city],
        rows
    );

}


/* =========================================================
   CENTROID
   ========================================================= */

function getCentroid(items) {

    if (
        !items ||
        !items.length
    ) {

        return null;

    }


    let lat = 0;

    let lng = 0;


    items.forEach(item => {

        lat += Number(item.lat);

        lng += Number(item.long);

    });


    return {

        lat:
            lat / items.length,

        lng:
            lng / items.length

    };

}


/* =========================================================
   TOOLTIP HELPERS
   ========================================================= */

function riskText(color) {

    if (color === DARK_RED) {

        return "High";

    }

    if (color === YELLOW) {

        return "Medium";

    }

    if (color === GREEN) {

        return "Low";

    }

    return "No Data";

}


/* =========================================================
   MUNICIPALITY TOOLTIP
   ========================================================= */

function municipalityTooltip(
    city,
    total,
    color
) {

    return `

        <div>

            <b>Municipality:</b>
            ${city}<br>

            <b>Total Incidents:</b>
            ${Number(total || 0).toLocaleString()}<br>

            <b>Risk:</b>
            ${riskText(color)}

        </div>

    `;

}


/* =========================================================
   GROUP TOOLTIP
   ========================================================= */

function groupTooltip(
    city,
    group,
    color
) {

    return `

        <div>

            <b>Municipality:</b>
            ${city}<br>

            <b>Group:</b>
            ${group.groupNumber}<br>

            <b>Districts:</b>
            ${group.items.length}<br>

            <b>Group Total Incidents:</b>
            ${Number(group.total || 0).toLocaleString()}<br>

            <b>Risk:</b>
            ${riskText(color)}

        </div>

    `;

}


/* =========================================================
   DISTRICT TOOLTIP
   ========================================================= */

function districtTooltip(
    city,
    group,
    item,
    color
) {

    return `

        <div>

            <b>District:</b>
            ${item.name}<br>

            <b>Municipality:</b>
            ${city}<br>

            <b>Group:</b>
            ${group.groupNumber}<br>

            <b>Incidents:</b>
            ${Number(item.count || 0).toLocaleString()}<br>

            <b>Risk:</b>
            ${riskText(color)}

        </div>

    `;

}


/* =========================================================
   COUNT BUBBLE
   ========================================================= */

function createCountBubbleLabel(
    lat,
    lng,
    text,
    bubbleClass,
    color,
    clickHandler,
    tooltipHtml = null
) {

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ) {

        return null;

    }


    const icon =
        L.divIcon({

            className:
                "count-bubble-wrapper",

            html: `

                <div
                    class="count-bubble ${bubbleClass}"
                    style="background:${color};">

                    ${Number(text || 0).toLocaleString()}

                </div>

            `,

            iconSize: null,

            iconAnchor: null

        });


    const marker =
        L.marker(
            [lat, lng],
            {
                icon,
                interactive: true
            }
        );


    if (clickHandler) {

        marker.on(
            "click",
            function(e) {

                if (
                    e &&
                    e.originalEvent
                ) {

                    L.DomEvent.stopPropagation(
                        e.originalEvent
                    );

                }

                clickHandler();

            }
        );

    }


    if (tooltipHtml) {

        marker.bindTooltip(
            tooltipHtml,
            {
                direction: "top",
                sticky: true,
                className: "custom-tooltip",
                opacity: 1
            }
        );

    }


    marker.addTo(labelLayer);


    return marker;

}


/* =========================================================
   CITY DISTRICTS
   ========================================================= */

function cityDistrictItems(city) {

    if (
        cityDistrictCache[city]
    ) {

        return cityDistrictCache[city];

    }


    const items = [];


    Object.keys(districtLayers)
        .forEach(name => {

            if (
                districtToCity[name] !== city
            ) {

                return;

            }


            const info =
                districtCounts[name];


            if (!info) {

                return;

            }


            const layer =
                districtLayers[name];


            let lat =
                Number(info.lat);

            let lng =
                Number(info.long);


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                const center =
                    layer &&
                    layer.getBounds &&
                    layer.getBounds().isValid()
                        ? layer.getBounds().getCenter()
                        : null;


                if (center) {

                    lat = center.lat;

                    lng = center.lng;

                }

            }


            items.push({

                name,

                count:
                    Number(info.count || 0),

                lat,

                long: lng

            });

        });


    cityDistrictCache[city] = items;


    return items;

}


/* =========================================================
   CREATE THREE GEOGRAPHIC GROUPS
   ========================================================= */

function createThreeGroups(rows) {

    if (
        !rows ||
        !rows.length
    ) {

        return [];

    }


    if (
        rows.length <= 3
    ) {

        return rows.map(
            (row, index) => ({

                groupNumber:
                    index + 1,

                items: [row],

                total:
                    Number(row.count || 0)

            })
        );

    }


    const centroid =
        getCentroid(rows);


    if (!centroid) {

        return [];

    }


    const sorted =
        rows

            .map(row => {

                const dx =
                    Number(row.long) -
                    centroid.lng;

                const dy =
                    Number(row.lat) -
                    centroid.lat;


                return {

                    row,

                    angle:
                        Math.atan2(
                            dy,
                            dx
                        )

                };

            })

            .sort(
                (a, b) =>
                    a.angle - b.angle
            )

            .map(x => x.row);


    const groupSize =
        Math.ceil(
            sorted.length / 3
        );


    const groups = [];


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const groupRows =
            sorted.slice(
                i * groupSize,
                (i + 1) * groupSize
            );


        if (
            !groupRows.length
        ) {

            continue;

        }


        groups.push({

            groupNumber:
                groups.length + 1,

            items:
                groupRows,

            total:
                groupRows.reduce(
                    (sum, row) =>
                        sum +
                        Number(row.count || 0),
                    0
                )

        });

    }


    return groups;

}


/* =========================================================
   CITY GROUP CACHE
   ========================================================= */

function getCityGroups(city) {

    if (
        cityGroupCache[city]
    ) {

        return cityGroupCache[city];

    }


    const rows =
        municipalityIncidentRows[city] || [];


    const groups =
        createThreeGroups(rows);


    cityGroupCache[city] = groups;


    return groups;

}


/* =========================================================
   MUNICIPALITY STYLE
   ========================================================= */

function getMunicipalityStyle(city) {

    return {

        color:
            getMunicipalityColor(city),

        weight: 2,

        opacity: 0.95,

        fillColor:
            getMunicipalityColor(city),

        fillOpacity: 0.28

    };

}


/* =========================================================
   NEUTRAL MUNICIPALITY OUTLINE
   ========================================================= */

function getNeutralMunicipalityStyle() {

    return {

        color: "#64748B",

        weight: 2,

        opacity: 0.9,

        fillColor: "#FFFFFF",

        fillOpacity: 0

    };

}


/* =========================================================
   HIDE ALL MUNICIPALITY BOUNDARIES
   ========================================================= */

function hideAllMunicipalityBoundaries() {

    CITIES.forEach(city => {

        const layer =
            municipalityBoundaryLayers[city];


        if (
            layer &&
            map.hasLayer(layer)
        ) {

            map.removeLayer(layer);

        }

    });

}


/* =========================================================
   SHOW ONLY SELECTED MUNICIPALITY OUTLINE
   ========================================================= */

function showSelectedMunicipalityOutline(
    city
) {

    hideAllMunicipalityBoundaries();


    const layer =
        municipalityBoundaryLayers[city];


    if (!layer) {

        return;

    }


    layer.setStyle(
        getNeutralMunicipalityStyle()
    );


    layer.unbindTooltip();


    const total =
        municipalityTotals[city] || 0;


    const color =
        getMunicipalityColor(city);


    layer.bindTooltip(

        municipalityTooltip(
            city,
            total,
            color
        ),

        {

            sticky: true,

            className:
                "custom-tooltip",

            opacity: 1

        }

    );


    layer.addTo(map);

}


/* =========================================================
   GROUP DISTRICT STYLE
   ========================================================= */

function setGroupDistrictStyle(
    districtName,
    color,
    group,
    city
) {

    const layer =
        districtLayers[districtName];


    if (!layer) {

        return;

    }


    layer.setStyle({

        color: "#FFFFFF",

        weight: 1.2,

        opacity: 0.95,

        fillColor: color,

        fillOpacity: 0.42

    });


    layer.unbindTooltip();


    layer.bindTooltip(

        groupTooltip(
            city,
            group,
            color
        ),

        {

            sticky: true,

            className:
                "custom-tooltip",

            opacity: 1

        }

    );


    layer.off("click");


    layer.on(
        "click",
        function() {

            showDistrictLevel(
                group,
                city
            );

        }
    );


    layer.addTo(visualLayer);

}


/* =========================================================
   GROUP LABEL
   ========================================================= */

function addGroupLabel(
    group,
    city,
    groupColor
) {

    const center =
        getCentroid(group.items);


    if (!center) {

        return;

    }


    createCountBubbleLabel(

        center.lat,

        center.lng,

        group.total,

        "group",

        groupColor,

        function() {

            showDistrictLevel(
                group,
                city
            );

        },

        groupTooltip(
            city,
            group,
            groupColor
        )

    );

}


/* =========================================================
   CLEAR VISUALS
   ========================================================= */

function clearVisuals() {

    visualLayer.clearLayers();

    labelLayer.clearLayers();

}


/* =========================================================
   HIDE ALL DISTRICT LAYERS
   ========================================================= */

function hideAllDistrictLayers() {

    Object.keys(districtLayers)
        .forEach(name => {

            const layer =
                districtLayers[name];


            if (
                layer &&
                map.hasLayer(layer)
            ) {

                map.removeLayer(layer);

            }

        });

}


/* =========================================================
   MUNICIPALITY OVERVIEW
   ========================================================= */

function showMunicipalityOverview() {

    drillLevel = 0;

    selectedMunicipality = null;

    selectedCluster = null;

    selectedDistrictName = null;

    currentClusters = [];


    clearVisuals();

    hideAllDistrictLayers();

    hideAllMunicipalityBoundaries();


    CITIES.forEach(city => {

        const layer =
            municipalityBoundaryLayers[city];


        if (!layer) {

            return;

        }


        const color =
            getMunicipalityColor(city);


        layer.setStyle(
            getMunicipalityStyle(city)
        );


        layer.unbindTooltip();


        layer.bindTooltip(

            municipalityTooltip(
                city,
                municipalityTotals[city],
                color
            ),

            {

                sticky: true,

                className:
                    "custom-tooltip",

                opacity: 1

            }

        );


        layer.addTo(map);


        const rows =
            municipalityIncidentRows[city] || [];


        let center =
            getCentroid(rows);


        if (!center) {

            const bounds =
                layer.getBounds();


            if (
                bounds.isValid()
            ) {

                const c =
                    bounds.getCenter();


                center = {

                    lat: c.lat,

                    lng: c.lng

                };

            }

        }


        if (center) {

            createCountBubbleLabel(

                center.lat,

                center.lng,

                municipalityTotals[city],

                "municipality",

                color,

                function() {

                    resetGrafanaVariable(city);

                    showMunicipality(city);

                },

                municipalityTooltip(
                    city,
                    municipalityTotals[city],
                    color
                )

            );

        }

    });


    const allLayers =
        CITIES

            .map(
                city =>
                    municipalityBoundaryLayers[city]
            )

            .filter(Boolean);


    if (allLayers.length) {

        const group =
            L.featureGroup(allLayers);


        if (
            group.getBounds().isValid()
        ) {

            map.fitBounds(
                group.getBounds(),
                {

                    padding: [35, 35],

                    maxZoom: 13

                }
            );

        }

    }


    document.getElementById(
        "mapInfo"
    ).innerHTML =
        "LEVEL 1 — MUNICIPALITIES";


    document.getElementById(
        "mapTitle"
    ).innerHTML =
        "Municipality Incident Overview";


    updateBackButton();

}


/* =========================================================
   MUNICIPALITY LEVEL 2
   ========================================================= */

function showMunicipality(city) {

    if (
        !CITIES.includes(city)
    ) {

        return;

    }


    drillLevel = 1;

    selectedMunicipality = city;

    selectedCluster = null;

    selectedDistrictName = null;


    clearVisuals();

    hideAllDistrictLayers();

    /*
       IMPORTANT:
       Remove ALL municipality fills.
       Only selected municipality gets a
       neutral outline.
    */

    showSelectedMunicipalityOutline(city);


    const groups =
        getCityGroups(city);


    currentClusters = groups;


    groups.forEach(group => {

        const rows =
            group.items || [];


        if (
            !rows.length
        ) {

            return;

        }


        const groupRows =
            rows.map(
                row => ({
                    count:
                        Number(row.count || 0)
                })
            );


        const groupColor =
            getRankedColor(
                group.total,
                groups.map(
                    g => ({
                        count:
                            g.total
                    })
                )
            );


        rows.forEach(item => {

            setGroupDistrictStyle(

                item.name,

                groupColor,

                group,

                city

            );

        });


        addGroupLabel(

            group,

            city,

            groupColor

        );

    });


    const boundary =
        municipalityBoundaryLayers[city];


    if (
        boundary &&
        boundary.getBounds().isValid()
    ) {

        map.fitBounds(

            boundary.getBounds(),

            {

                padding: [40, 40],

                maxZoom: 14

            }

        );

    }


    document.getElementById(
        "mapInfo"
    ).innerHTML =
        `LEVEL 2 — ${city.toUpperCase()}`;


    document.getElementById(
        "mapTitle"
    ).innerHTML =
        `${city} — Incident Groups`;


    updateBackButton();

}


/* =========================================================
   DISTRICT CLICK
   ========================================================= */

function handleDistrictClick(
    item,
    city
) {

    if (
        selectedDistrictName === item.name
    ) {

        selectedDistrictName = null;

        resetGrafanaVariable(city);

        showMunicipality(city);

        return;

    }


    selectedDistrictName =
        item.name;


    window.parent.postMessage(

        {

            type: "mapClick",

            state: item.name,

            municipality: city,

            lat: item.lat,

            long: item.long

        },

        "*"

    );

}


/* =========================================================
   LEVEL 3
   ========================================================= */

function showDistrictLevel(
    group,
    city
) {

    if (
        !group ||
        !CITIES.includes(city)
    ) {

        return;

    }


    drillLevel = 2;

    selectedMunicipality = city;

    selectedCluster = group;


    clearVisuals();

    hideAllDistrictLayers();

    /*
       No municipality background
       at Level 3.
    */

    showSelectedMunicipalityOutline(city);


    const rows =
        group.items || [];


    const comparisonRows =
        rows.map(
            row => ({
                count:
                    Number(row.count || 0)
            })
        );


    rows.forEach(item => {

        const layer =
            districtLayers[item.name];


        if (!layer) {

            return;

        }


        const color =
            getRankedColor(
                item.count,
                comparisonRows
            );


        layer.setStyle({

            color: "#FFFFFF",

            weight: 1.5,

            opacity: 0.95,

            fillColor: color,

            fillOpacity: 0.58

        });


        layer.unbindTooltip();


        layer.bindTooltip(

            districtTooltip(
                city,
                group,
                item,
                color
            ),

            {

                sticky: true,

                className:
                    "custom-tooltip",

                opacity: 1

            }

        );


        layer.off("click");


        layer.on(

            "click",

            function() {

                handleDistrictClick(
                    item,
                    city
                );

            }

        );


        layer.addTo(visualLayer);


        createCountBubbleLabel(

            item.lat,

            item.long,

            item.count,

            "district",

            color,

            function() {

                handleDistrictClick(
                    item,
                    city
                );

            },

            districtTooltip(
                city,
                group,
                item,
                color
            )

        );

    });


    const points =
        rows

            .filter(
                row =>
                    Number.isFinite(
                        Number(row.lat)
                    ) &&
                    Number.isFinite(
                        Number(row.long)
                    )
            )

            .map(
                row =>
                    [
                        Number(row.lat),
                        Number(row.long)
                    ]
            );


    if (points.length) {

        map.fitBounds(

            L.latLngBounds(points),

            {

                padding: [45, 45],

                maxZoom: 16

            }

        );

    }


    document.getElementById(
        "mapInfo"
    ).innerHTML =

        `LEVEL 3 — ${city.toUpperCase()} — GROUP ${group.groupNumber}`;


    document.getElementById(
        "mapTitle"
    ).innerHTML =

        `${city} — Group ${group.groupNumber} — Districts`;


    updateBackButton();

}

   RESET GRAFANA VARIABLE

function resetGrafanaVariable(

/* =========================================================
   DISTRICT INITIAL STYLE
   ========================================================= */

function districtInitialStyle(
    feature
) {

    const props =
        feature.properties || {};


    const name =
        props.REMARKS ||
        props.NameEn ||
        props.NAME ||
        props.name ||
        "Unknown";


    const count =
        getDistrictCount(name);


    const color =
        count > 0
            ? GREEN
            : NO_DATA;


    return {

        color: "#FFFFFF",

        weight: 1,

        opacity: 0.8,

        fillColor: color,

        fillOpacity: 0.35

    };

}


/* =========================================================
   MAKE DISTRICT NODES
   ========================================================= */

function makeDistrictNodes(
    data,
    city
) {

    const nodes = [];


    const features =
        data.features || [];


    features.forEach(
        feature => {

            const props =
                feature.properties || {};


            const districtName =
                props.REMARKS ||
                props.NameEn ||
                props.NAME ||
                props.name;


            if (!districtName) {

                return;

            }


            districtToCity[
                districtName
            ] = city;


            const key =
                districtLookupKey(
                    districtName
                );


            districtNameLookup[key] = {

                name: districtName,

                city,

                count:
                    getDistrictCount(
                        districtName
                    )

            };


            const layer =
                L.geoJSON(

                    feature,

                    {

                        style:
                            districtInitialStyle

                    }

                );


            layer.bindTooltip(

                `

                <div>

                    <b>District:</b>
                    ${districtName}<br>

                    <b>Municipality:</b>
                    ${city}

                </div>

                `,

                {

                    sticky: true,

                    className:
                        "custom-tooltip"

                }

            );


            districtLayers[
                districtName
            ] = layer;


            nodes.push({

                label:
                    districtName,

                layer

            });

        }
    );


    return nodes;

}


/* =========================================================
   LOAD GEOJSON
   ========================================================= */

Promise.all([

    fetch(
        "./municipality.geojson"
    ).then(
        response =>
            response.json()
    ),

    fetch(
        "./dammam.geojson"
    ).then(
        response =>
            response.json()
    ),

    fetch(
        "./dhahran.geojson"
    ).then(
        response =>
            response.json()
    ),

    fetch(
        "./khobar.geojson"
    ).then(
        response =>
            response.json()
    )

])

.then(
    ([
        municipalityData,
        dammamData,
        dhahranData,
        khobarData
    ]) => {


        /* =================================================
           MUNICIPALITY BOUNDARIES
           ================================================= */

        municipalityData.features.forEach(
            feature => {

                const props =
                    feature.properties || {};


                const rawName =
                    props.NameEn ||
                    props.NAME ||
                    props.name ||
                    props.REMARKS ||
                    "";


                const normalized =
                    normalizeName(
                        rawName
                    );


                let city = null;


                CITIES.forEach(
                    candidate => {

                        if (
                            normalizeName(
                                candidate
                            ) === normalized
                        ) {

                            city =
                                candidate;

                        }

                    }
                );


                if (!city) {

                    if (
                        normalized.includes(
                            "dammam"
                        )
                    ) {

                        city = "Dammam";

                    }
                    else if (
                        normalized.includes(
                            "dhahran"
                        )
                    ) {

                        city = "Dhahran";

                    }
                    else if (
                        normalized.includes(
                            "khobar"
                        )
                    ) {

                        city = "Khobar";

                    }

                }


                if (!city) {

                    return;

                }


                if (
                    !municipalityBoundaryFeatures[
                        city
                    ]
                ) {

                    municipalityBoundaryFeatures[
                        city
                    ] = [];

                }


                municipalityBoundaryFeatures[
                    city
                ].push(feature);


                const layer =
                    L.geoJSON(

                        feature,

                        {

                            style:
                                getMunicipalityStyle(
                                    city
                                )

                        }

                    );


                layer.bindTooltip(

                    municipalityTooltip(
                        city,
                        municipalityTotals[city],
                        getMunicipalityColor(city)
                    ),

                    {

                        sticky: true,

                        className:
                            "custom-tooltip"

                    }

                );


                layer.on(
                    "click",
                    function() {

                        resetGrafanaVariable(
                            city
                        );

                        showMunicipality(
                            city
                        );

                    }
                );


                /*
                   IMPORTANT:
                   No mouseover/mouseout color
                   changes. Risk color remains
                   stable under cursor.
                */


                municipalityBoundaryLayers[
                    city
                ] = layer;


                if (
                    layer.getBounds().isValid()
                ) {

                    const center =
                        layer
                            .getBounds()
                            .getCenter();


                    municipalityCenters[
                        city
                    ] = {

                        lat: center.lat,

                        long: center.lng

                    };

                }


                layer.addTo(map);

            }
        );


        /* =================================================
           DISTRICT GEOJSON
           ================================================= */

        const dammamDistricts =
            makeDistrictNodes(
                dammamData,
                "Dammam"
            );


        const dhahranDistricts =
            makeDistrictNodes(
                dhahranData,
                "Dhahran"
            );


        const khobarDistricts =
            makeDistrictNodes(
                khobarData,
                "Khobar"
            );


        /* =================================================
           LAYER TREE
           ================================================= */

        const overlaysTree = {

            label:
                "Map Layers",

            selectAllCheckbox:
                false,

            children: [

                {

                    label:
                        "Dammam",

                    selectAllCheckbox:
                        true,

                    collapsed:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers.Dammam

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            collapsed:
                                true,

                            children:
                                dammamDistricts

                        }

                    ]

                },


                {

                    label:
                        "Dhahran",

                    selectAllCheckbox:
                        true,

                    collapsed:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers.Dhahran

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            collapsed:
                                true,

                            children:
                                dhahranDistricts

                        }

                    ]

                },


                {

                    label:
                        "Khobar",

                    selectAllCheckbox:
                        true,

                    collapsed:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers.Khobar

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            collapsed:
                                true,

                            children:
                                khobarDistricts

                        }

                    ]

                }

            ]

        };


        /* =================================================
           LAYER CONTROL
           DEFAULT BASEMAP = OSM
           ================================================= */

        const layerControl =
            L.control.layers.tree(

                {

                    "OpenStreetMap":
                        osm,

                    "Satellite":
                        satellite

                },

                overlaysTree,

                {

                    collapsed: true,

                    namedToggle: true,

                    selectorBack: false,

                    closedSymbol: "▶",

                    openedSymbol: "▼"

                }

            );


        layerControl.addTo(map);


        /* =================================================
           LAYER CONTROL ISOLATION
           ================================================= */

        map.on(
            "overlayadd",
            function(e) {

                const addedLayer =
                    e.layer;


                /*
                   MUNICIPALITY BOUNDARY
                */

                const city =
                    CITIES.find(
                        c =>
                            municipalityBoundaryLayers[c] ===
                            addedLayer
                    );


                if (city) {

                    /*
                       Selecting a municipality
                       switches completely to that
                       municipality.
                    */

                    if (
                        drillLevel === 0 ||
                        selectedMunicipality !== city
                    ) {

                        resetGrafanaVariable(
                            city
                        );

                        showMunicipality(
                            city
                        );

                    }
                    else {

                        showMunicipality(
                            city
                        );

                    }

                    return;

                }


                /*
                   DISTRICT LAYER
                */

                const districtName =
                    Object.keys(
                        districtLayers
                    ).find(
                        name =>
                            districtLayers[name] ===
                            addedLayer
                    );


                if (!districtName) {

                    return;

                }


                const districtCity =
                    districtToCity[
                        districtName
                    ];


                /*
                   If we are already inside
                   a municipality, do not allow
                   another municipality's
                   district to appear.
                */

                if (
                    selectedMunicipality &&
                    districtCity !==
                        selectedMunicipality
                ) {

                    map.removeLayer(
                        addedLayer
                    );

                    return;

                }


                /*
                   At Level 3 only districts
                   belonging to the selected
                   group are allowed.
                */

                if (
                    drillLevel === 2 &&
                    selectedCluster
                ) {

                    const belongsToGroup =
                        selectedCluster.items.some(
                            item =>
                                item.name ===
                                districtName
                        );


                    if (
                        !belongsToGroup
                    ) {

                        map.removeLayer(
                            addedLayer
                        );

                    }

                }

            }
        );


        /* =================================================
           INITIAL STATE
           ================================================= */

        mapReady = true;


        if (
            pendingIncidentData
        ) {

            applyIncidentData(
                pendingIncidentData
            );

            pendingIncidentData =
                null;

        }
        else {

            showMunicipalityOverview();

        }


        /* =================================================
           INFORM GRAFANA
           ================================================= */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );

    }

)

.catch(
    error => {

        console.error(
            "GeoJSON loading error:",
            error
        );

    }
);


/* =========================================================
   INCIDENT DATA FROM GRAFANA
   ========================================================= */

function applyIncidentData(
    rows
) {

    if (
        !Array.isArray(rows)
    ) {

        return;

    }


    const previousLevel =
        drillLevel;


    const previousMunicipality =
        selectedMunicipality;


    const previousDistrict =
        selectedDistrictName;


    const previousGroupNumber =
        selectedCluster
            ? selectedCluster.groupNumber
            : null;


    /* =====================================================
       RESET DATA
       ===================================================== */

    Object.keys(
        districtCounts
    ).forEach(
        key =>
            delete districtCounts[key]
    );


    Object.keys(
        districtNameLookup
    ).forEach(
        key =>
            delete districtNameLookup[key]
    );


    CITIES.forEach(city => {

        municipalityIncidentRows[
            city
        ] = [];

        municipalityTotals[
            city
        ] = 0;

        delete cityDistrictCache[
            city
        ];

        delete cityGroupCache[
            city
        ];

    });


    /* =====================================================
       PROCESS INCIDENT ROWS
       ===================================================== */

    rows.forEach(row => {

        const state =
            row.state ??
            row.State ??
            "";


        const count =
            Number(
                row.count ??
                row.Count ??
                0
            );


        const lat =
            Number(
                row.lat ??
                row.Lat ??
                row.latitude ??
                row.Latitude
            );


        const lng =
            Number(
                row.long ??
                row.Long ??
                row.lng ??
                row.longitude ??
                row.Longitude
            );


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {

            return;

        }


        const city =
            resolveMunicipality(
                state,
                lat,
                lng
            );


        if (!city) {

            return;

        }


        municipalityTotals[
            city
        ] += count;


        const cleanState =
            String(state ?? "").trim();


        /*
           District mapping
        */

        let canonicalName =
            cleanState;


        const key =
            districtLookupKey(
                cleanState
            );


        if (
            districtNameLookup[key]
        ) {

            canonicalName =
                districtNameLookup[key].name;

        }


        districtCounts[
            canonicalName
        ] = {

            count,

            lat,

            long: lng

        };


        districtNameLookup[
            key
        ] = {

            name:
                canonicalName,

            city,

            count,

            lat,

            long: lng

        };


        municipalityIncidentRows[
            city
        ].push({

            name:
                canonicalName,

            count,

            lat,

            long: lng

        });

    });


    /* =====================================================
       UPDATE DISTRICT STYLES
       ===================================================== */

    Object.keys(
        districtLayers
    ).forEach(
        name => {

            const layer =
                districtLayers[name];


            const count =
                getDistrictCount(name);


            const color =
                count > 0
                    ? GREEN
                    : NO_DATA;


            layer.setStyle({

                color: "#FFFFFF",

                weight: 1,

                opacity: 0.8,

                fillColor: color,

                fillOpacity: 0.35

            });

        }
    );


    /* =====================================================
       RESTORE PREVIOUS LEVEL
       ===================================================== */

    if (
        previousLevel === 2 &&
        previousMunicipality
    ) {

        const groups =
            getCityGroups(
                previousMunicipality
            );


        const restoredGroup =
            groups.find(
                group =>
                    group.groupNumber ===
                    previousGroupNumber
            );


        if (restoredGroup) {

            showDistrictLevel(
                restoredGroup,
                previousMunicipality
            );


            if (
                previousDistrict
            ) {

                selectedDistrictName =
                    previousDistrict;

            }

            return;

        }

    }


    if (
        previousLevel === 1 &&
        previousMunicipality
    ) {

        showMunicipality(
            previousMunicipality
        );

        return;

    }


    showMunicipalityOverview();

}


/* =========================================================
   GRAFANA MESSAGE LISTENER
   ========================================================= */

window.addEventListener(
    "message",
    function(event) {

        const data =
            event.data;


        if (!data) {

            return;

        }


        if (
            data.type !==
            "incidentData"
        ) {

            return;

        }


        const rows =
            data.data || [];


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(
            rows
        );

    }
);


/* =========================================================
   EXPOSE FUNCTIONS
   ========================================================= */

window.showMunicipality =
    showMunicipality;

window.showMunicipalityOverview =
    showMunicipalityOverview;

window.showDistrictLevel =
    showDistrictLevel;

window.applyIncidentData =
    applyIncidentData;

window.handleBack =
    handleBack;


/* =========================================================
   INITIAL BACK BUTTON STATE
   ========================================================= */

setTimeout(
    updateBackButton,
    100
);

</script>

</body>

</html>
