<html lang="en">

<head>

<meta charset="UTF-8">

<meta

    content="width=device-width, initial-scale=1.0"
/>

<title>Municipality Incident Map</title>

<link
    rel="stylesheet"

/>

<style>

html,
body {

    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#map {

    width: 100%;
    height: 100vh;

    background: #e5e7eb;

}

/* =========================================================
   TOP TITLE
========================================================= */

.map-title {

    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.95);

/* =========================================================

========================================================= */

    left: 50%;

    transform: translateX(-50%);

}

   LEGEND
========================================================= */

    left: 15px;

/* =========================================================
   LEAFLET LAYER CONTROL
========================================================= */

.leaflet-control-layers {

/* =========================================================

@media(max-width:700px) {

}

<body>


<div id="map"></div>


<div

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js"></script>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CITIES = [

    "Dammam",
    "Dhahran",
    "Khobar"

];


const CITY_FILES = {

    Dammam:
        "./dammam.geojson",

    Dhahran:
        "./dhahran.geojson",

    Khobar:
        "./khobar.geojson"

};


const MUNICIPALITY_FILE =
    "./municipality.geojson";


/* =========================================================
   COLORS
========================================================= */

const DARK_RED =
    "#A61B1B";

const GREEN =
    "#2E7D32";

const YELLOW =
    "#F9A825";

const NO_DATA =
    "#64748B";


/* =========================================================
   GLOBAL STATE
========================================================= */

const districtCounts = {

    Dammam: {},
    Dhahran: {},
    Khobar: {}

};


const districtDefinitionsByCity = {

    Dammam: [],
    Dhahran: [],
    Khobar: []

};


const districtLayers = {

    Dammam: {},
    Dhahran: {},
    Khobar: {}

};


const districtToCity = {};


const municipalityBoundaryLayers = {};


const municipalityBoundaryFeatures = {};


const municipalityCenters = {};


const municipalityIncidentRows = {

    Dammam: [],
    Dhahran: [],
    Khobar: []

};


const municipalityTotals = {

    Dammam: 0,
    Dhahran: 0,
    Khobar: 0

};


const cityDistrictCache = {};


const cityGroupCache = {};


const boundaryLayerToCity =
    new Map();


const districtLayerToCity =
    new Map();


let municipalityGeoJSON =
    null;


let drillLevel = 0;


/*
    0 = Municipality
    1 = Groups
    2 = Districts
*/


let selectedMunicipality =
    null;


let selectedClusterIndex =
    null;


let selectedDistrictName =
    null;


let currentClusters = [];


let mapReady = false;


let pendingGrafanaRows = null;


/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

    maxZoom: 19,

    zoomControl: true,

    preferCanvas: true

});


/* =========================================================
   BASE MAPS
========================================================= */

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

);


const satellite = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 19,

        attribution:
            "Tiles &copy; Esri"

    }

);


/*
    OSM is DEFAULT.
*/

osm.addTo(map);


/* =========================================================
   VISUAL LAYERS
========================================================= */

const visualLayer =
    L.layerGroup().addTo(map);


const labelLayer =
    L.layerGroup().addTo(map);


/* =========================================================
   HTML HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatNumber(value) {

    const n =
        Number(value) || 0;

    return n.toLocaleString("en-US");

}


/* =========================================================
   NAME NORMALIZATION
========================================================= */

function normalizeArabic(value) {

    return String(value ?? "")

        .replace(/[أإآ]/g, "ا")

        .replace(/ة/g, "ه")

        .replace(/ى/g, "ي")

        .replace(/\u0640/g, "")

        .replace(/[\u064B-\u065F]/g, "")

        .replace(/\s+/g, " ")

        .trim();

}


function normalizeName(value) {

    return normalizeArabic(value)

        .toLowerCase()

        .replace(/[_\-]+/g, " ")

        .replace(/\s+/g, " ")

        .trim();

}


function districtLookupKey(value) {

    return normalizeName(value)

        .replace(/[^\p{L}\p{N}]+/gu, "");

}


/* =========================================================
   CITY NAME RESOLUTION
========================================================= */

function resolveCityName(value) {

    const raw =
        String(value ?? "");

    const normalized =
        normalizeName(raw);


    if (

        normalized.includes("dammam") ||

        normalized.includes("ad dammam") ||

        raw.includes("الدمام") ||

        raw.includes("دمام")

    ) {

        return "Dammam";

    }


    if (

        normalized.includes("dhahran") ||

        normalized.includes("ad dhahran") ||

        raw.includes("الظهران") ||

        raw.includes("ظهران")

    ) {

        return "Dhahran";

    }


    if (

        normalized.includes("khobar") ||

        normalized.includes("al khobar") ||

        normalized.includes("alkhobar") ||

        raw.includes("الخبر") ||

        raw.includes("خبر")

    ) {

        return "Khobar";

    }


    return null;

}


/* =========================================================
   FEATURE NAME
========================================================= */

function getFeatureName(feature) {

    const p =
        feature?.properties || {};


    const candidates = [

        p.REMARKS,
        p.Remarks,
        p.NameEn,
        p.name_en,
        p.NAME_EN,
        p.NAME,
        p.Name,
        p.name,
        p.NAME_1,
        p.NAME_2,
        p.GOV_NAME,
        p.DISTRICT,
        p.District,
        p.DistrictName,
        p.district,
        p.label

    ];


    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {

            return String(value).trim();

        }

    }


    return "Unknown";

}


/* =========================================================
   GEOMETRY
========================================================= */

function pointInRing(point, ring) {

    const x = point[0];

    const y = point[1];

    let inside = false;


    for (

        let i = 0,
            j = ring.length - 1;

        i < ring.length;

        j = i++

    ) {

        const xi =
            ring[i][0];

        const yi =
            ring[i][1];

        const xj =
            ring[j][0];

        const yj =
            ring[j][1];


        const intersect =

            ((yi > y) !== (yj > y)) &&

            (
                x <
                (xj - xi) *
                (y - yi) /
                ((yj - yi) || 1e-12) +
                xi
            );


        if (intersect) {

            inside = !inside;

        }

    }


    return inside;

}


function pointInPolygon(point, polygon) {

    if (!polygon || !polygon.length) {

        return false;

    }


    if (!pointInRing(point, polygon[0])) {

        return false;

    }


    for (let i = 1; i < polygon.length; i++) {

        if (
            pointInRing(point, polygon[i])
        ) {

            return false;

        }

    }


    return true;

}


function pointInGeometry(point, geometry) {

    if (!geometry) {

        return false;

    }


    if (geometry.type === "Polygon") {

        return pointInPolygon(
            point,
            geometry.coordinates
        );

    }


    if (geometry.type === "MultiPolygon") {

        return geometry.coordinates.some(
            polygon =>
                pointInPolygon(
                    point,
                    polygon
                )
        );

    }


    if (geometry.type === "GeometryCollection") {

        return geometry.geometries.some(
            g =>
                pointInGeometry(
                    point,
                    g
                )
        );

    }


    return false;

}


/* =========================================================
   MUNICIPALITY RESOLUTION
========================================================= */

function resolveMunicipalityByCoordinates(
    lat,
    lng
) {

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        !municipalityGeoJSON
    ) {

        return null;

    }


    const point = [lng, lat];


    for (
        const feature
        of municipalityGeoJSON.features || []
    ) {

        const city =
            resolveCityName(
                getFeatureName(feature)
            );


        if (!city) {

            continue;

        }


        if (
            pointInGeometry(
                point,
                feature.geometry
            )
        ) {

            return city;

        }

    }


    return null;

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceSquared(
    aLat,
    aLng,
    bLat,
    bLng
) {

    const dLat =
        aLat - bLat;

    const dLng =
        aLng - bLng;

    return dLat * dLat +
           dLng * dLng;

}


/* =========================================================
   FALLBACK MUNICIPALITY
========================================================= */

function resolveMunicipalityFallback(
    lat,
    lng
) {

    let bestCity =
        null;

    let bestDistance =
        Infinity;


    for (const city of CITIES) {

        const center =
            municipalityCenters[city];


        if (!center) {

            continue;

        }


        const d =
            distanceSquared(
                lat,
                lng,
                center.lat,
                center.lng
            );


        if (d < bestDistance) {

            bestDistance = d;

            bestCity = city;

        }

    }


    return bestCity;

}


/* =========================================================
   RESOLVE MUNICIPALITY
========================================================= */

function resolveMunicipality(
    districtName,
    lat,
    lng
) {

    const key =
        districtLookupKey(
            districtName
        );


    /*
        First use exact district mapping.
    */

    for (const city of CITIES) {

        if (
            districtToCity[
                `${city}|${key}`
            ]
        ) {

            return city;

        }

    }


    /*
        Then coordinate polygon.
    */

    const coordinateCity =
        resolveMunicipalityByCoordinates(
            lat,
            lng
        );


    if (coordinateCity) {

        return coordinateCity;

    }


    /*
        Final fallback.
    */

    return resolveMunicipalityFallback(
        lat,
        lng
    );

}


/* =========================================================
   RISK
========================================================= */

function getRankedColor(
    value,
    values
) {

    const v =
        Number(value) || 0;


    if (v <= 0) {

        return NO_DATA;

    }


    const unique = [

        ...new Set(

            values

                .map(Number)

                .filter(
                    x => x > 0
                )

        )

    ].sort(
        (a,b) => a-b
    );


    if (unique.length === 0) {

        return NO_DATA;

    }


    if (unique.length === 1) {

        return GREEN;

    }


    if (unique.length === 2) {

        return (
            v === unique[1]
                ? DARK_RED
                : GREEN
        );

    }


    const rank =
        unique.indexOf(v);


    const n =
        unique.length;


    /*
        Lowest third = green
        Middle third = yellow
        Highest third = red
    */

    if (
        rank < n / 3
    ) {

        return GREEN;

    }


    if (
        rank >= (2 * n) / 3
    ) {

        return DARK_RED;

    }


    return YELLOW;

}


/* =========================================================
   RISK LABEL
========================================================= */

function getRiskLabel(color) {

    if (color === DARK_RED) {

        return "High";

    }


    if (color === YELLOW) {

        return "Medium";

    }


    if (color === GREEN) {

        return "Low";

    }


    return "No Data";

}


/* =========================================================
   CENTROID
========================================================= */

function getFeatureCenter(feature) {

    try {

        return L.geoJSON(
            feature
        ).getBounds().getCenter();

    }

    catch (error) {

        return null;

    }

}


/* =========================================================
   UPDATE TITLE / INFO
========================================================= */

function updateMapInfo() {

    const title =
        document.getElementById(
            "mapTitle"
        );

    const info =
        document.getElementById(
            "mapInfo"
        );

    const back =
        document.getElementById(
            "backButton"
        );


    if (drillLevel === 0) {

        title.textContent =
            "Incidents by Municipality";

        info.textContent =
            "Select a municipality to explore geographic groups";

        back.style.display =
            "none";

        return;

    }


    if (drillLevel === 1) {

        title.textContent =
            `${selectedMunicipality} — Geographic Groups`;

        info.textContent =
            "Select a group to view its actual districts";

        back.style.display =
            "block";

        return;

    }


    const groupNumber =
        selectedClusterIndex !== null
            ? selectedClusterIndex + 1
            : "";

    title.textContent =
        `${selectedMunicipality} — Group ${groupNumber} — Districts`;

    info.textContent =
        "Select a district to filter the dashboard";

    back.style.display =
        "block";

}


/* =========================================================
   TOOLTIP HTML
========================================================= */

function municipalityTooltip(
    city,
    count,
    color
) {

    return `

        <div class="map-tooltip">

            <div class="map-tooltip-title">
                ${escapeHtml(city)}
            </div>

                <span class="map-tooltip-label">
                    Incidents
                </span>

                <span class="map-tooltip-value">

                </span>

            </div>

            <div class="map-tooltip-row">

                <span class="map-tooltip-label">
                    Risk
                </span>

                <span class="map-tooltip-value">
                    ${getRiskLabel(color)}
                </span>

            </div>

}


function groupTooltip(

    return `

        <div class="map-tooltip">

                ${escapeHtml(city)} — Group ${group.index + 1}

                </span>

}


function districtTooltip(
    city,
    group,

) {

    return `

        <div class="map-tooltip">

            <div class="map-tooltip-title">
                ${escapeHtml(item.name)}
            </div>

            <div class="map-tooltip-row">

                <span class="map-tooltip-label">
                    Municipality
                </span>

                <span class="map-tooltip-value">
                    ${escapeHtml(city)}
                </span>

            </div>

            <div class="map-tooltip-row">

                <span class="map-tooltip-label">
                    Group
                </span>

                <span class="map-tooltip-value">
                    ${group.index + 1}
                </span>

            </div>

            <div class="map-tooltip-row">

                <span class="map-tooltip-label">
                    Incidents
                </span>

                <span class="map-tooltip-value">
                    ${formatNumber(item.count)}
                </span>

            </div>

            <div class="map-tooltip-row">

                <span class="map-tooltip-label">
                    Risk
                </span>

                <span class="map-tooltip-value">
                    ${getRiskLabel(color)}
                </span>

            </div>

        </div>

    `;

}


/* =========================================================
   COUNT BUBBLE
========================================================= */

function createCountBubbleLabel(
    latlng,
    type,
    value,
    color,
    tooltipHtml,
    clickHandler
) {

    const sizes = {

        municipality: 54,
        group: 44,
        district: 34

    };


    const size =
        sizes[type] || 34;


    const html = `

        <div
            class="count-bubble ${type}"
            style="background:${color};"
        >
            ${formatNumber(value)}
        </div>

    `;


    const marker =
        L.marker(
            latlng,
            {

                icon:
                    L.divIcon({

                        className:
                            "",

                        html:
                            html,

                        iconSize:
                            [size, size],

                        iconAnchor:
                            [
                                size / 2,
                                size / 2
                            ],

                        tooltipAnchor:
                            [
                                0,
                                -size / 2
                            ]

                    }),

                keyboard:
                    false,

                bubblingMouseEvents:
                    false

            }
        );


    if (tooltipHtml) {

        marker.bindTooltip(
            tooltipHtml,
            {

                direction:
                    "top",

                sticky:
                    true,

                opacity:
                    0.97

            }
        );

    }


    if (clickHandler) {

        marker.on(
            "click",
            function(e) {

                if (
                    e.originalEvent
                ) {

                    L.DomEvent.stopPropagation(
                        e.originalEvent
                    );

                }

                clickHandler(e);

            }
        );

    }


    return marker;

}


/* =========================================================
   CITY DISTRICT ITEMS
========================================================= */

function cityDistrictItems(city) {

    if (
        cityDistrictCache[city]
    ) {

        return cityDistrictCache[city];

    }


    const aggregated = {};


    /*
        Aggregate Grafana rows.
    */

    for (
        const row
        of municipalityIncidentRows[city] || []
    ) {

        const key =
            districtLookupKey(
                row.district
            );


        if (!key) {

            continue;

        }


        if (!aggregated[key]) {

            aggregated[key] = {

                name:
                    row.district,

                count:
                    0,

                lat:
                    Number(row.lat),

                lng:
                    Number(row.lng)

            };

        }


        aggregated[key].count +=
            Number(row.count) || 0;


        if (
            !Number.isFinite(
                aggregated[key].lat
            ) &&
            Number.isFinite(
                Number(row.lat)
            )
        ) {

            aggregated[key].lat =
                Number(row.lat);

        }


        if (
            !Number.isFinite(
                aggregated[key].lng
            ) &&
            Number.isFinite(
                Number(row.lng)
            )
        ) {

            aggregated[key].lng =
                Number(row.lng);

        }

    }


    const items = [];


    /*
        Start from GeoJSON definitions
        so zero-count districts remain visible.
    */

    for (
        const definition
        of districtDefinitionsByCity[city]
    ) {

        const key =
            definition.key;


        const aggregate =
            aggregated[key];


        let lat =
            aggregate?.lat;

        let lng =
            aggregate?.lng;


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {

            const center =
                definition.center;

            if (center) {

                lat =
                    center.lat;

                lng =
                    center.lng;

            }

        }


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {

            continue;

        }


        items.push({

            name:
                definition.name,

            key:
                key,

            count:
                Number(
                    aggregate?.count
                ) || 0,

            lat:
                lat,

            lng:
                lng,

            layer:
                definition.layer

        });

    }


    /*
        Include Grafana districts which
        weren't found in GeoJSON.
    */

    for (
        const key
        of Object.keys(aggregated)
    ) {

        const alreadyExists =
            items.some(
                item =>
                    item.key === key
            );


        if (
            alreadyExists
        ) {

            continue;

        }


        const item =
            aggregated[key];


        if (
            Number.isFinite(item.lat) &&
            Number.isFinite(item.lng)
        ) {

            items.push({

                name:
                    item.name,

                key:
                    key,

                count:
                    item.count,

                lat:
                    item.lat,

                lng:
                    item.lng,

                layer:
                    null

            });

        }

    }


    cityDistrictCache[city] =
        items;


    return items;

}


/* =========================================================
   CREATE THREE GEOGRAPHIC GROUPS
========================================================= */

function createThreeGroups(items) {

    if (!items.length) {

        return [];

    }


    /*
        If 1-3 districts exist,
        create one group per district.
    */

    if (items.length <= 3) {

        return items.map(
            (item, index) => ({

                index:

                    index,

                items:

                    [item],

                total:

                    item.count,

                center:

                    {
                        lat:
                            item.lat,

                        lng:
                            item.lng
                    }

            })
        );

    }


    /*
        Find geographic center.
    */

    const center = {

        lat:
            items.reduce(
                (sum, item) =>
                    sum + item.lat,
                0
            ) / items.length,

        lng:
            items.reduce(
                (sum, item) =>
                    sum + item.lng,
                0
            ) / items.length

    };


    /*
        Sort by angle around center.

        This creates geographic sectors
        instead of random groups.
    */

    const sorted =
        [...items].sort(
            (a,b) => {

                const angleA =
                    Math.atan2(
                        a.lat - center.lat,
                        a.lng - center.lng
                    );

                const angleB =
                    Math.atan2(
                        b.lat - center.lat,
                        b.lng - center.lng
                    );

                return angleA - angleB;

            }
        );


    const groups = [];


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const start =
            Math.floor(
                i * sorted.length / 3
            );

        const end =
            Math.floor(
                (i + 1) *
                sorted.length / 3
            );


        const groupItems =
            sorted.slice(
                start,
                end
            );


        if (!groupItems.length) {

            continue;

        }


        const total =
            groupItems.reduce(
                (sum, item) =>
                    sum + item.count,
                0
            );


        const groupCenter = {

            lat:
                groupItems.reduce(
                    (sum, item) =>
                        sum + item.lat,
                    0
                ) / groupItems.length,

            lng:
                groupItems.reduce(
                    (sum, item) =>
                        sum + item.lng,
                    0
                ) / groupItems.length

        };


        groups.push({

            index:
                groups.length,

            items:
                groupItems,

            total:
                total,

            center:
                groupCenter

        });

    }


    return groups;

}


/* =========================================================
   CITY GROUP CACHE
========================================================= */

function getCityGroups(city) {

    if (
        cityGroupCache[city]
    ) {

        return cityGroupCache[city];

    }


    const items =
        cityDistrictItems(city);


    const groups =
        createThreeGroups(items);


    cityGroupCache[city] =
        groups;


    return groups;

}


/* =========================================================
   SET GEOJSON STYLE
========================================================= */

function setLayerStyle(
    layer,
    style
) {

    if (!layer) {

        return;

    }


    if (
        typeof layer.setStyle ===
        "function"
    ) {

        layer.setStyle(style);

    }


    if (
        typeof layer.eachLayer ===
        "function"
    ) {

        layer.eachLayer(
            child => {

                if (
                    child &&
                    typeof child.setStyle ===
                    "function"
                ) {

                    child.setStyle(style);

                }

            }
        );

    }

}


/* =========================================================
   HIDE ALL DISTRICTS
========================================================= */

function hideAllDistrictLayers() {

    for (const city of CITIES) {

        for (
            const key
            of Object.keys(
                districtLayers[city]
            )
        ) {

            const layer =
                districtLayers[city][key];


            if (
                map.hasLayer(layer)
            ) {

                map.removeLayer(
                    layer
                );

            }

        }

    }

}


/* =========================================================
   HIDE ALL MUNICIPALITIES
========================================================= */

function hideAllMunicipalityBoundaries() {

    for (const city of CITIES) {

        const layer =
            municipalityBoundaryLayers[
                city
            ];


        if (
            layer &&
            map.hasLayer(layer)
        ) {

            map.removeLayer(layer);

        }

    }

}


/* =========================================================
   CLEAR VISUALS
========================================================= */

function clearVisuals() {

    visualLayer.clearLayers();

    labelLayer.clearLayers();

    hideAllDistrictLayers();

}


/* =========================================================
   MUNICIPALITY OVERVIEW
========================================================= */

function showMunicipalityOverview() {

    drillLevel = 0;

    selectedMunicipality =
        null;

    selectedClusterIndex =
        null;

    selectedDistrictName =
        null;

    currentClusters = [];


    clearVisuals();

    hideAllMunicipalityBoundaries();


    const allBounds =
        [];


    /*
        Show all municipality
        backgrounds ONLY at Level 1.
    */

    const totals =
        CITIES.map(
            city =>
                municipalityTotals[city]
        );


    for (const city of CITIES) {

        const layer =
            municipalityBoundaryLayers[
                city
            ];


        if (!layer) {

            continue;

        }


        const color =
            getRankedColor(
                municipalityTotals[city],
                totals
            );


        setLayerStyle(
            layer,
            {

                color:
                    color,

                weight:
                    2,

                opacity:
                    0.95,

                fillColor:
                    color,

                fillOpacity:
                    0.28

            }
        );


        const tooltip =
            municipalityTooltip(
                city,
                municipalityTotals[city],
                color
            );


        layer.unbindTooltip();

        layer.bindTooltip(
            tooltip,
            {

                sticky:
                    true,

                direction:
                    "top"

            }
        );


        layer.off("click");


        layer.on(
            "click",
            function(e) {

                if (
                    e.originalEvent
                ) {

                    L.DomEvent.stopPropagation(
                        e.originalEvent
                    );

                }


                resetGrafanaVariable(
                    city
                );


                showMunicipality(
                    city
                );

            }
        );


        map.addLayer(layer);


        const bounds =
            layer.getBounds();


        if (
            bounds.isValid()
        ) {

            allBounds.push(
                bounds
            );

        }


        const center =
            municipalityCenters[
                city
            ];


        if (center) {

            const bubble =
                createCountBubbleLabel(

                    center,

                    "municipality",

                    municipalityTotals[
                        city
                    ],

                    color,

                    tooltip,

                    function() {

                        resetGrafanaVariable(
                            city
                        );

                        showMunicipality(
                            city
                        );

                    }

                );


            labelLayer.addLayer(
                bubble
            );

        }

    }


    if (allBounds.length) {

        const featureGroup =
            L.featureGroup(
                CITIES
                    .map(
                        city =>
                            municipalityBoundaryLayers[
                                city
                            ]
                    )
                    .filter(Boolean)
            );


        if (
            featureGroup.getBounds().isValid()
        ) {

            map.fitBounds(
                featureGroup.getBounds(),
                {

                    padding:
                        [35,35],

                    maxZoom:
                        13,

                    animate:
                        true

                }
            );

        }

    }


    updateMapInfo();

}


/* =========================================================
   SHOW MUNICIPALITY / GROUP LEVEL
========================================================= */

function showMunicipality(city) {

    if (
        !CITIES.includes(city)
    ) {

        return;

    }


    drillLevel = 1;

    selectedMunicipality =
        city;

    selectedClusterIndex =
        null;

    selectedDistrictName =
        null;


    clearVisuals();

    hideAllMunicipalityBoundaries();


    /*
        Keep only selected municipality
        as a NEUTRAL OUTLINE.

        NO background fill.
    */

    const boundary =
        municipalityBoundaryLayers[
            city
        ];


    if (boundary) {

        setLayerStyle(
            boundary,
            {

                color:
                    "#475569",

                weight:
                    2,

                opacity:
                    0.95,

                fillColor:
                    "#ffffff",

                fillOpacity:
                    0

            }
        );


        boundary.unbindTooltip();


        boundary.bindTooltip(
            `

            <div class="map-tooltip">

                <div class="map-tooltip-title">
                    ${escapeHtml(city)}
                </div>

                <div class="map-tooltip-row">

                    <span class="map-tooltip-label">
                        Total Incidents
                    </span>

                    <span class="map-tooltip-value">
                        ${formatNumber(
                            municipalityTotals[city]
                        )}
                    </span>

                </div>

            </div>

            `,
            {

                sticky:
                    true,

                direction:
                    "top"

            }
        );


        map.addLayer(
            boundary
        );

    }


    const groups =
        getCityGroups(city);


    currentClusters =
        groups;


    const groupTotals =
        groups.map(
            group =>
                group.total
        );


    /*
        Show all district polygons
        belonging ONLY to selected city.

        District fill is transparent.
        Group color is used only
        for the border.
    */

    groups.forEach(
        (group) => {

            const groupColor =
                getRankedColor(
                    group.total,
                    groupTotals
                );


            const groupTooltip =
                groupTooltip(
                    city,
                    group,
                    groupColor
                );


            group.items.forEach(
                item => {

                    const layer =
                        districtLayers[
                            city
                        ][
                            item.key
                        ];


                    if (!layer) {

                        return;

                    }


                    setLayerStyle(
                        layer,
                        {

                            color:
                                groupColor,

                            weight:
                                1.6,

                            opacity:
                                0.90,

                            fillColor:
                                "#ffffff",

                            fillOpacity:
                                0.01

                        }
                    );


                    layer.unbindTooltip();

                    layer.bindTooltip(
                        groupTooltip,
                        {

                            sticky:
                                true,

                            direction:
                                "top"

                        }
                    );


                    layer.off("click");


                    layer.on(
                        "click",
                        function(e) {

                            if (
                                e.originalEvent
                            ) {

                                L.DomEvent.stopPropagation(
                                    e.originalEvent
                                );

                            }


                            selectedClusterIndex =
                                group.index;

                            selectedDistrictName =
                                item.name;


                            resetGrafanaVariable(
                                city
                            );


                            window.parent.postMessage(
                                {

                                    type:
                                        "mapClick",

                                    state:
                                        item.name,

                                    municipality:
                                        city,

                                    lat:
                                        item.lat,

                                    long:
                                        item.lng

                                },
                                "*"
                            );


                            showDistrictLevel(
                                group,
                                city
                            );

                        }
                    );


                    map.addLayer(
                        layer
                    );

                }
            );


            /*
                Group bubble.
            */

            if (
                group.center
            ) {

                const tooltip =
                    groupTooltip;


                const bubble =
                    createCountBubbleLabel(

                        group.center,

                        "group",

                        group.total,

                        groupColor,

                        tooltip,

                        function() {

                            selectedClusterIndex =
                                group.index;

                            selectedDistrictName =
                                null;


                            showDistrictLevel(
                                group,
                                city
                            );

                        }

                    );


                labelLayer.addLayer(
                    bubble
                );

            }

        }
    );


    /*
        Fit selected municipality.
    */

    if (boundary) {

        const bounds =
            boundary.getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {

                    padding:
                        [30,30],

                    maxZoom:
                        14,

                    animate:
                        true

                }
            );

        }

    }


    updateMapInfo();

}


/* =========================================================
   SHOW DISTRICT LEVEL
========================================================= */

function showDistrictLevel(
    group,
    city
) {

    if (
        !group ||
        !city
    ) {

        return;

    }


    drillLevel = 2;

    selectedMunicipality =
        city;

    selectedClusterIndex =
        group.index;


    clearVisuals();

    hideAllMunicipalityBoundaries();


    /*
        Selected municipality outline ONLY.
        NO background.
    */

    const boundary =
        municipalityBoundaryLayers[
            city
        ];


    if (boundary) {

        setLayerStyle(
            boundary,
            {

                color:
                    "#64748B",

                weight:
                    1.8,

                opacity:
                    0.8,

                fillColor:
                    "#ffffff",

                fillOpacity:
                    0

            }
        );


        boundary.unbindTooltip();


        boundary.bindTooltip(
            `

            <div class="map-tooltip">

                <div class="map-tooltip-title">
                    ${escapeHtml(city)}
                </div>

                <div class="map-tooltip-row">

                    <span class="map-tooltip-label">
                        Group
                    </span>

                    <span class="map-tooltip-value">
                        ${group.index + 1}
                    </span>

                </div>

                <div class="map-tooltip-row">

                    <span class="map-tooltip-label">
                        Incidents
                    </span>

                    <span class="map-tooltip-value">
                        ${formatNumber(
                            group.total
                        )}
                    </span>

                </div>

            </div>

            `,
            {

                sticky:
                    true,

                direction:
                    "top"

            }
        );


        map.addLayer(
            boundary
        );

    }


    /*
        Risk ranking INSIDE the selected group.
    */

    const districtValues =
        group.items.map(
            item =>
                item.count
        );


    const boundsLayers =
        [];


    group.items.forEach(
        item => {

            const color =
                getRankedColor(
                    item.count,
                    districtValues
                );


            const layer =
                districtLayers[
                    city
                ][
                    item.key
                ];


            const tooltip =
                districtTooltip(
                    city,
                    group,
                    item,
                    color
                );


            if (layer) {

                /*
                    IMPORTANT:
                    No heavy district fill.
                    Only thin risk-colored border.
                */

                setLayerStyle(
                    layer,
                    {

                        color:
                            color,

                        weight:
                            1.7,

                        opacity:
                            0.95,

                        fillColor:
                            "#ffffff",

                        fillOpacity:
                            0.02

                    }
                );


                layer.unbindTooltip();

                layer.bindTooltip(
                    tooltip,
                    {

                        sticky:
                            true,

                        direction:
                            "top"

                    }
                );


                layer.off("click");


                layer.on(
                    "click",
                    function(e) {

                        if (
                            e.originalEvent
                        ) {

                            L.DomEvent.stopPropagation(
                                e.originalEvent
                            );

                        }


                        handleDistrictClick(
                            item,
                            city,
                            group
                        );

                    }
                );


                map.addLayer(
                    layer
                );


                boundsLayers.push(
                    layer
                );

            }


            /*
                Smaller district bubble.
            */

            const bubble =
                createCountBubbleLabel(

                    {
                        lat:
                            item.lat,

                        lng:
                            item.lng
                    },

                    "district",

                    item.count,

                    color,

                    tooltip,

                    function() {

                        handleDistrictClick(
                            item,
                            city,
                            group
                        );

                    }

                );


            labelLayer.addLayer(
                bubble
            );

        }
    );


    /*
        Zoom into selected group.
    */

    if (
        boundsLayers.length
    ) {

        const groupBounds =
            L.featureGroup(
                boundsLayers
            ).getBounds();


        if (
            groupBounds.isValid()
        ) {

            map.fitBounds(
                groupBounds,
                {

                    padding:
                        [30,30],

                    maxZoom:
                        17,

                    animate:
                        true

                }
            );

        }

    }
    else if (
        group.center
    ) {

        map.setView(
            [
                group.center.lat,
                group.center.lng
            ],
            16,
            {

                animate:
                    true

            }
        );

    }


    updateMapInfo();

}


/* =========================================================
   DISTRICT CLICK
========================================================= */

function handleDistrictClick(
    item,
    city,
    group
) {

    if (
        selectedDistrictName ===
            item.name &&
        drillLevel === 2
    ) {

        /*
            Same district clicked again.

            Return to Group level.
        */

        resetGrafanaVariable(
            city
        );


        selectedDistrictName =
            null;


        showMunicipality(
            city
        );


        return;

    }


    selectedMunicipality =
        city;

    selectedClusterIndex =
        group.index;

    selectedDistrictName =
        item.name;


    /*
        Send district to Grafana.
    */

    window.parent.postMessage(
        {

            type:
                "mapClick",

            state:
                item.name,

            municipality:
                city,

            lat:
                item.lat,

            long:
                item.lng

        },
        "*"
    );


    /*
        Stay on district level.
    */

    showDistrictLevel(
        group,
        city
    );

}


/* =========================================================
   RESET GRAFANA VARIABLE
========================================================= */

function resetGrafanaVariable(
    municipality
) {

    window.parent.postMessage(
        {

            type:
                "mapClick",

            state:
                "All",

            municipality:
                municipality || null

        },
        "*"
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

function back() {

    if (
        drillLevel === 2 &&
        selectedMunicipality
    ) {

        selectedDistrictName =
            null;

        showMunicipality(
            selectedMunicipality
        );

        return;

    }


    if (
        drillLevel === 1
    ) {

        showMunicipalityOverview();

        return;

    }


    showMunicipalityOverview();

}


/* =========================================================
   DISTRICT TREE
========================================================= */

function makeDistrictNodes(
    city
) {

    return (

        districtDefinitionsByCity[
            city
        ] || []

    )

        .sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        )

        .map(
            definition => ({

                label:
                    definition.name,

                layer:
                    definition.layer

            })
        );

}


/* =========================================================
   BUILD LAYER TREE
========================================================= */

function buildLayerControl() {

    const overlaysTree = {

        label:
            "Municipalities",

        children:

            CITIES.map(
                city => ({

                    label:
                        city,

                    layer:
                        municipalityBoundaryLayers[
                            city
                        ],

                    collapsed:
                        true,

                    children: [

                        {

                            label:
                                "Districts",

                            collapsed:
                                true,

                            selectAllCheckbox:
                                true,

                            children:
                                makeDistrictNodes(
                                    city
                                )

                        }

                    ]

                })
            )

    };


    L.control.layers.tree(

        {

            "OpenStreetMap":
                osm,

            "Satellite":
                satellite

        },

        overlaysTree,

        {

            collapsed:
                true,

            namedToggle:
                true,

            selectorBack:
                false,

            closedSymbol:
                "▶",

            openedSymbol:
                "▼"

        }

    ).addTo(map);

}


/* =========================================================
   LAYER CONTROL ISOLATION
========================================================= */

map.on(
    "overlayadd",
    function(e) {

        /*
            Municipality selected
            from right-side tree.
        */

        const city =
            boundaryLayerToCity.get(
                e.layer
            );


        if (city) {

            /*
                If another municipality is
                selected, immediately switch
                to that municipality.
            */

            if (
                selectedMunicipality !== city ||
                drillLevel === 0
            ) {

                resetGrafanaVariable(
                    city
                );

                showMunicipality(
                    city
                );

            }

            return;

        }


        /*
            District selected from tree.
        */

        const districtCity =
            districtLayerToCity.get(
                e.layer
            );


        if (districtCity) {

            /*
                Never allow another municipality
                to appear.
            */

            if (
                !selectedMunicipality ||
                districtCity !==
                    selectedMunicipality
            ) {

                map.removeLayer(
                    e.layer
                );

                return;

            }


            /*
                District layer selection is allowed
                only when inside selected municipality.
            */

            if (
                drillLevel === 0
            ) {

                map.removeLayer(
                    e.layer
                );

                return;

            }


            /*
                At Group level only the selected
                municipality is allowed.
            */

            if (
                drillLevel === 1
            ) {

                return;

            }


            /*
                At District level only selected
                group districts should be visible.
            */

            if (
                drillLevel === 2 &&
                selectedClusterIndex !== null
            ) {

                const groups =
                    getCityGroups(
                        selectedMunicipality
                    );


                const group =
                    groups[
                        selectedClusterIndex
                    ];


                if (!group) {

                    map.removeLayer(
                        e.layer
                    );

                    return;

                }


                const allowed =
                    group.items.some(
                        item =>
                            item.layer ===
                            e.layer
                    );


                if (!allowed) {

                    map.removeLayer(
                        e.layer
                    );

                }

            }

        }

    }
);


/* =========================================================
   LAYER CONTROL REMOVE ISOLATION
========================================================= */

map.on(
    "overlayremove",
    function(e) {

        /*
            If the user removes a municipality
            while on a drill-down level,
            keep the selected municipality
            visual logic intact.
        */

        const city =
            boundaryLayerToCity.get(
                e.layer
            );


        if (
            city &&
            city === selectedMunicipality &&
            drillLevel > 0
        ) {

            /*
                Re-add neutral outline.
            */

            setTimeout(
                function() {

                    if (
                        selectedMunicipality === city
                    ) {

                        const layer =
                            municipalityBoundaryLayers[
                                city
                            ];


                        if (
                            layer &&
                            !map.hasLayer(layer)
                        ) {

                            map.addLayer(
                                layer
                            );

                        }

                    }

                },
                0
            );

        }

    }
);


/* =========================================================
   APPLY INCIDENT DATA
========================================================= */

function applyIncidentData(
    rows
) {

    if (
        !Array.isArray(rows)
    ) {

        return;

    }


    /*
        Reset data.
    */

    for (const city of CITIES) {

        municipalityIncidentRows[
            city
        ] = [];

        municipalityTotals[
            city
        ] = 0;

        districtCounts[
            city
        ] = {};

        delete cityDistrictCache[
            city
        ];

        delete cityGroupCache[
            city
        ];

    }


    /*
        Parse Grafana rows.
    */

    for (
        const row
        of rows
    ) {

        if (!row) {

            continue;

        }


        const districtName =
            String(

                row.state ??
                row.State ??
                row.district ??
                row.District ??
                row.DistrictName ??
                row.name ??
                ""

            ).trim();


        const count =
            Number(

                row.count ??
                row.Count ??
                row.value ??
                row.Value ??
                0

            ) || 0;


        const lat =
            Number(

                row.lat ??
                row.Lat ??
                row.latitude ??
                row.Latitude

            );


        const lng =
            Number(

                row.long ??
                row.lng ??
                row.lon ??
                row.longitude ??
                row.Longitude

            );


        if (!districtName) {

            continue;

        }


        const city =
            resolveMunicipality(
                districtName,
                lat,
                lng
            );


        if (!city) {

            continue;

        }


        const key =
            districtLookupKey(
                districtName
            );


        if (!key) {

            continue;

        }


        if (
            !districtCounts[
                city
            ][key]
        ) {

            districtCounts[
                city
            ][key] = 0;

        }


        districtCounts[
            city
        ][key] += count;


        municipalityIncidentRows[
            city
        ].push({

            district:
                districtName,

            count:
                count,

            lat:
                lat,

            lng:
                lng

        });


        municipalityTotals[
            city
        ] += count;

    }


    /*
        Redraw current level.
    */

    if (!mapReady) {

        return;

    }


    if (
        drillLevel === 0
    ) {

        showMunicipalityOverview();

        return;

    }


    if (
        !selectedMunicipality
    ) {

        showMunicipalityOverview();

        return;

    }


    if (
        drillLevel === 1
    ) {

        showMunicipality(
            selectedMunicipality
        );

        return;

    }


    if (
        drillLevel === 2
    ) {

        const groups =
            getCityGroups(
                selectedMunicipality
            );


        let group =
            null;


        if (
            selectedClusterIndex !== null
        ) {

            group =
                groups[
                    selectedClusterIndex
                ];

        }


        if (!group) {

            showMunicipality(
                selectedMunicipality
            );

            return;

        }


        showDistrictLevel(
            group,
            selectedMunicipality
        );

    }

}


/* =========================================================
   EXTRACT GRAFANA ROWS
========================================================= */

function extractGrafanaRows(
    message
) {

    if (!message) {

        return null;

    }


    /*
        Some Grafana integrations send:

        {
            data: [...]
        }
    */

    const data =
        message.data;


    if (
        Array.isArray(data)
    ) {

        return data;

    }


    if (
        Array.isArray(
            data?.rows
        )
    ) {

        return data.rows;

    }


    /*
        Grafana dataframe format:

        data.series[0].fields
    */

    const series =
        data?.series ||
        data?.data?.series;


    if (
        Array.isArray(series) &&
        series.length
    ) {

        const firstSeries =
            series[0];


        const fields =
            firstSeries?.fields;


        if (
            Array.isArray(fields) &&
            fields.length
        ) {

            let length =
                0;


            for (
                const field
                of fields
            ) {

                const values =
                    field.values;


                if (
                    Array.isArray(values)
                ) {

                    length =
                        Math.max(
                            length,
                            values.length
                        );

                }
                else if (
                    values &&
                    typeof values.length ===
                    "number"
                ) {

                    length =
                        Math.max(
                            length,
                            values.length
                        );

                }

            }


            const rows =
                [];


            for (
                let i = 0;
                i < length;
                i++
            ) {

                const row =
                    {};


                for (
                    const field
                    of fields
                ) {

                    let values =
                        field.values;


                    if (
                        values &&
                        !Array.isArray(values) &&
                        typeof values.toArray ===
                        "function"
                    ) {

                        values =
                            values.toArray();

                    }


                    row[
                        field.name
                    ] =
                        values?.[i];

                }


                rows.push(
                    row
                );

            }


            return rows;

        }

    }


    /*
        Another possible dataframe format.
    */

    if (
        Array.isArray(
            data?.fields
        )
    ) {

        const fields =
            data.fields;


        let length =
            0;


        fields.forEach(
            field => {

                const values =
                    field.values;


                if (
                    values &&
                    typeof values.length ===
                    "number"
                ) {

                    length =
                        Math.max(
                            length,
                            values.length
                        );

                }

            }
        );


        const rows =
            [];


        for (
            let i = 0;
            i < length;
            i++
        ) {

            const row =
                {};


            fields.forEach(
                field => {

                    let values =
                        field.values;


                    if (
                        values &&
                        typeof values.toArray ===
                        "function"
                    ) {

                        values =
                            values.toArray();

                    }


                    row[
                        field.name
                    ] =
                        values?.[i];

                }
            );


            rows.push(
                row
            );

        }


        return rows;

    }


    return null;

}


/* =========================================================
   LOAD GEOJSON
========================================================= */

async function loadGeoJson(
    url
) {

    const response =
        await fetch(
            url,
            {

                cache:
                    "no-store"

            }
        );


    if (!response.ok) {

        throw new Error(
            `Unable to load ${url}`
        );

    }


    return response.json();

}


/* =========================================================
   BUILD MUNICIPALITY LAYERS
========================================================= */

function buildMunicipalityLayers() {

    if (
        !municipalityGeoJSON
    ) {

        return;

    }


    for (
        const feature
        of municipalityGeoJSON.features || []
    ) {

        const rawName =
            getFeatureName(
                feature
            );


        const city =
            resolveCityName(
                rawName
            );


        if (
            !city ||
            municipalityBoundaryLayers[
                city
            ]
        ) {

            continue;

        }


        const layer =
            L.geoJSON(
                feature
            );


        municipalityBoundaryLayers[
            city
        ] =
            layer;


        municipalityBoundaryFeatures[
            city
        ] =
            feature;


        boundaryLayerToCity.set(
            layer,
            city
        );


        const center =
            getFeatureCenter(
                feature
            );


        if (center) {

            municipalityCenters[
                city
            ] =
                center;

        }

    }

}


/* =========================================================
   BUILD DISTRICT LAYERS
========================================================= */

async function buildDistrictLayers(
    city,
    geojson
) {

    if (
        !geojson
    ) {

        return;

    }


    const features =
        geojson.features || [];


    for (
        const feature
        of features
    ) {

        const name =
            getFeatureName(
                feature
            );


        if (
            !name ||
            name === "Unknown"
        ) {

            continue;

        }


        const key =
            districtLookupKey(
                name
            );


        if (!key) {

            continue;

        }


        const layer =
            L.geoJSON(
                feature
            );


        /*
            If duplicate names occur,
            keep first actual polygon.
        */

        if (
            districtLayers[
                city
            ][key]
        ) {

            continue;

        }


        districtLayers[
            city
        ][key] =
            layer;


        districtLayerToCity.set(
            layer,
            city
        );


        const center =
            getFeatureCenter(
                feature
            );


        districtDefinitionsByCity[
            city
        ].push({

            name:
                name,

            key:
                key,

            center:
                center,

            layer:
                layer

        });


        districtToCity[
            `${city}|${key}`
        ] =
            city;

    }

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initMap() {

    try {

        /*
            Load municipality GeoJSON.
        */

        municipalityGeoJSON =
            await loadGeoJson(
                MUNICIPALITY_FILE
            );


        buildMunicipalityLayers();


        /*
            Load all district GeoJSON.
        */

        await Promise.all(

            CITIES.map(
                async city => {

                    const geojson =
                        await loadGeoJson(
                            CITY_FILES[
                                city
                            ]
                        );


                    await buildDistrictLayers(
                        city,
                        geojson
                    );

                }
            )

        );


        /*
            Build right-side layer tree.
        */

        buildLayerControl();


        /*
            Initial view.
        */

        showMunicipalityOverview();


        mapReady =
            true;


        /*
            If Grafana sent data
            before initialization,
            process it now.
        */

        if (
            pendingGrafanaRows
        ) {

            const rows =
                pendingGrafanaRows;


            pendingGrafanaRows =
                null;


            applyIncidentData(
                rows
            );

        }

    }

    catch (error) {

        console.error(
            "Map initialization failed:",
            error
        );


        document.getElementById(
            "mapInfo"
        ).textContent =
            "Unable to load map GeoJSON files. Check file paths.";

    }

}


/* =========================================================
   GRAFANA MESSAGE HANDLER
========================================================= */

let pendingRowsForFrame =
    null;


let updateQueued =
    false;


window.addEventListener(
    "message",
    function(event) {

        try {

            const rows =
                extractGrafanaRows(
                    event.data
                );


            if (
                !rows
            ) {

                return;

            }


            pendingRowsForFrame =
                rows;


            if (
                !mapReady
            ) {

                pendingGrafanaRows =
                    rows;

                return;

            }


            /*
                Prevent multiple immediate
                redraws when Grafana sends
                several messages together.
            */

            if (
                !updateQueued
            ) {

                updateQueued =
                    true;


                requestAnimationFrame(
                    function() {

                        updateQueued =
                            false;


                        if (
                            pendingRowsForFrame
                        ) {

                            const rowsToApply =
                                pendingRowsForFrame;


                            pendingRowsForFrame =
                                null;


                            applyIncidentData(
                                rowsToApply
                            );

                        }

                    }
                );

            }

        }

        catch (error) {

            console.error(
                "Grafana message error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

initMap();


/* =========================================================
   OPTIONAL RESIZE SUPPORT
========================================================= */

window.addEventListener(
    "resize",
    function() {

        setTimeout(
            function() {

                map.invalidateSize();

            },
            100
        );

    }
);


</script>
