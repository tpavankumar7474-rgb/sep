/* =========================================================
   DRILL-DOWN HEAT MAP
   Each view has a heat surface plus plain text count labels.
   Labels are clickable; they are not bubble markers.
   ========================================================= */

function clearHeatVisuals() {
    incidentHeatLayer.setLatLngs([]);
    heatLabelLayer.clearLayers();
}


function getHeatWeight(count, stats) {
    count = Number(count || 0);

    if (!count || !stats || !stats.max) return 0;

    // Use the actual count as the heat intensity, just like
    // the Folium HeatMap in the Python version.
    return count;
}


function addHeatCountLabel(item, title, onClick) {
    if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) return;

    const icon = L.divIcon({
        className: "heat-label-marker",
        html: `<div class="heat-data-label"><b>${title}</b><span>${Number(item.count || 0).toLocaleString()} incidents</span></div>`,
        iconSize: [112, 42],
        iconAnchor: [56, 21]
    });

    const label = L.marker([item.lat, item.lng], {
        icon,
        keyboard: true,
        zIndexOffset: 2000,
        interactive: true
    });

    if (onClick) label.on("click", onClick);
    heatLabelLayer.addLayer(label);
}


function renderHeatLevel(items, labelFor, onClickFor, radius) {
    /* Disabled intentionally: final 3-level map uses polygon colors only. */
    try { incidentHeatLayer.setLatLngs([]); } catch(e) {}
    try { map.removeLayer(incidentHeatLayer); } catch(e) {}
    try { heatLabelLayer.clearLayers(); map.removeLayer(heatLabelLayer); } catch(e) {}
}


function fitToItems(items, padding, maxZoom) {
    const points = (items || [])
        .filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng))
        .map(item => [item.lat, item.lng]);

    if (!points.length) return;
    const bounds = L.latLngBounds(points);
    if (bounds.isValid()) map.fitBounds(bounds, { padding, maxZoom });
}


function showMunicipalityOverview() {
    drillLevel = 0;
    selectedMunicipality = null;
    selectedCluster = null;
    selectedSubCluster = null;
    currentClusters = [];

    const municipalities = CITIES.map(city => ({
        city,
        count: municipalityTotals[city] || 0,
        lat: municipalityCenters[city]?.lat,
        lng: municipalityCenters[city]?.long
    }));

    renderHeatLevel(
        municipalities,
        item => item.city,
        item => () => showMunicipality(item.city),
        82
    );

    CITIES.forEach(city => {
        const boundary = municipalityBoundaryLayers[city];
        if (!boundary) return;
        boundary.off("click");
        boundary.on("click", () => showMunicipality(city));
    });

    const boundaries = CITIES.map(city => municipalityBoundaryLayers[city]).filter(Boolean);
    if (boundaries.length) {
        const bounds = L.featureGroup(boundaries).getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
    }

    updateMapInfo("Municipalities — click a municipality or its count label");
    updateBackButton();
}


function showMunicipality(city) {
    selectedMunicipality = city;
    selectedCluster = null;
    selectedSubCluster = null;
    drillLevel = 1;

    const rows = prepareRows(municipalityIncidentRows[city] || [], city);
    currentClusters = createClusters(rows);

    renderHeatLevel(
        currentClusters,
        item => `Group ${item.index + 1}`,
        item => () => showSecondLevel(item, city),
        62
    );

    const boundary = municipalityBoundaryLayers[city];
    if (boundary && boundary.getBounds().isValid()) {
        map.fitBounds(boundary.getBounds(), { padding: [70, 70], maxZoom: 13 });
    }

    updateMapInfo(`<b>${city}</b> — 3 heat groups; click a group label`);
    updateBackButton();
}


function showSecondLevel(cluster, city) {
    selectedCluster = cluster;
    selectedSubCluster = null;
    drillLevel = 2;

    currentClusters = createClusters(cluster.items || []);

    renderHeatLevel(
        currentClusters,
        item => `Sub-group ${item.index + 1}`,
        item => () => showDistrictLevel(item, city),
        52
    );

    fitToItems(cluster.items, [100, 100], 15);
    updateMapInfo(`<b>${city}</b> — Group ${cluster.index + 1}; click a sub-group label`);
    updateBackButton();
}


function showDistrictLevel(cluster, city) {
    selectedSubCluster = cluster;
    drillLevel = 3;

    const rows = cluster.items || [];
    renderHeatLevel(
        rows,
        item => item.name || "District",
        item => () => {
            window.parent.postMessage({
                type: "mapClick",
                state: item.name,
                municipality: city,
                lat: item.lat,
                long: item.lng
            }, "*");
        },
        42
    );

    fitToItems(rows, [90, 90], 17);
    updateMapInfo(`<b>${city}</b> — districts; click a district label to filter Grafana`);
    updateBackButton();
}
/* =========================================================
   APPLY GRAFANA DATA
   ========================================================= */

function applyIncidentData(rows) {


    /* =====================================================
       RESET
       ===================================================== */

    Object.keys(
        districtCounts
    ).forEach(key => {

        delete districtCounts[key];

    });


    Object.keys(
        districtNameLookup
    ).forEach(key => {

        delete districtNameLookup[key];

    });


    CITIES.forEach(city => {

        municipalityTotals[city] =
            0;

        municipalityIncidentRows[city] =
            [];

    });


    /* =====================================================
       PROCESS ROWS
       ===================================================== */

    (rows || []).forEach(row => {

        const name =
            String(
                row.state || ""
            ).trim();


        const count =
            Number(
                row.count || 0
            );


        let lat =
            Number(row.lat);


        let lng =
            Number(row.long);


        if (

            !name ||

            !Number.isFinite(count)

        ) {

            return;

        }


        if (

            !Number.isFinite(lat)

        ) {

            lat = null;

        }


        if (

            !Number.isFinite(lng)

        ) {

            lng = null;

        }


        const resolution =

            resolveMunicipality(

                name,

                lat,

                lng

            );


        if (

            !resolution.city

        ) {

            console.warn(

                "Could not resolve municipality:",

                {

                    name,

                    count,

                    lat,

                    lng

                }

            );

            return;

        }


        const city =
            resolution.city;


        /* ------------------------------------------------
           Municipality total
           ------------------------------------------------ */

        municipalityTotals[city] +=
            count;


        /* ------------------------------------------------
           Exact district
           ------------------------------------------------ */

        const exactDistrict =
            districtToCity[name];


        if (exactDistrict) {

            districtCounts[
                exactDistrict
            ] = {

                count,

                lat,

                long:
                    lng

            };

        }


        /* ------------------------------------------------
           Normalized lookup
           ------------------------------------------------ */

        districtNameLookup[

            districtLookupKey(name)

        ] = {

            name,

            city,

            count

        };


        /* ------------------------------------------------
           KEEP EVERY ROW
           ------------------------------------------------ */

        municipalityIncidentRows[city]
            .push({

                name,

                count,

                lat,

                lng,

                displayLat:
                    lat,

                displayLng:
                    lng,

                city,

                method:
                    resolution.method

            });

    });


    /* =====================================================
       FALLBACK POSITIONS
       ===================================================== */

    CITIES.forEach(city => {

        const rowsForCity =

            municipalityIncidentRows[city];


        rowsForCity.forEach(

            (row, index) => {

                if (

                    !Number.isFinite(row.lat) ||

                    !Number.isFinite(row.lng)

                ) {

                    const fallback =

                        fallbackCoordinate(

                            city,

                            index,

                            rowsForCity.length

                        );


                    if (fallback) {

                        row.lat =
                            fallback.lat;

                        row.lng =
                            fallback.lng;

                        row.displayLat =
                            fallback.lat;

                        row.displayLng =
                            fallback.lng;

                    }

                }

            }

        );

    });


    /* =====================================================
       UPDATE DISTRICT POLYGONS
       ===================================================== */

    Object.keys(
        districtLayers
    ).forEach(name => {

        const city =
            districtToCity[name];


        const layer =
            districtLayers[name];


        if (!layer) {

            return;

        }


        layer.setStyle(

            districtStyle(

                city,

                name

            )

        );


        const count =
            getDistrictCount(name);


        const risk =

            count > 0

                ? getLayerRisk(

                    count,

                    {

                        min: count,

                        max: count,

                        lowLimit: count,

                        highLimit: count

                    }

                )

                : {

                    level:
                        "No Data",

                    color:
                        "#94a3b8",

                    className:
                        "no-data-count"

                };


        layer.setTooltipContent(

            districtTooltipHtml(

                name,

                city,

                count,

                risk

            )

        );

    });


    /* =====================================================
       RESET DRILL STATE
       ===================================================== */

    drillLevel =
        0;

    selectedMunicipality =
        null;

    selectedCluster =
        null;

    selectedSubCluster =
        null;

    currentClusters = [];


    /* =====================================================
       SHOW MUNICIPALITIES
       ===================================================== */

    showMunicipalityOverview();


    scheduleRefresh();

}


/* =========================================================
   REFRESH
   ========================================================= */

function scheduleRefresh() {

    if (refreshTimer) {

        clearTimeout(
            refreshTimer
        );

    }


    refreshTimer =

        setTimeout(

            () => {

                refreshTimer =
                    null;

                refreshMap();

            },

            100

        );

}


/* =========================================================
   REFRESH MAP
   ========================================================= */

function refreshMap() {

    if (

        drillLevel === 0

    ) {

        showMunicipalityOverview();

    }

}


/* =========================================================
   RECEIVE GRAFANA DATA
   ========================================================= */

window.addEventListener(

    "message",

    event => {

        if (

            event.data?.type !==
            "incidentData"

        ) {

            return;

        }


        const rows =
            event.data.data || [];


        console.log(

            "Received incident data:",

            rows

        );


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(rows);

    }

);

    function makePlainLabel(lat,lng,text,cls,onClick){

                html:String(text),
                iconSize:[1,1],
                iconAnchor:[0,0]
            }),
            zIndexOffset:3000,
            interactive:true,
            keyboard:true
        });
        if(onClick) m.on('click',onClick);
        finalLabelLayer.addLayer(m);
        return m;
    }

    function heatGradient(color){
        if(color === '#ef4444') return {
            0.12:'#450a0a',
            0.30:'#7f1d1d',
            0.50:'#b91c1c',
            0.70:'#dc2626',
            0.86:'#ef4444',
            1.00:'#f87171'
        };
        if(color === '#facc15') return {
            0.12:'#422006',
            0.30:'#713f12',
            0.50:'#a16207',
            0.70:'#ca8a04',
            0.86:'#eab308',
            1.00:'#fde047'
        };
        return {
            0.12:'#052e16',
            0.30:'#14532d',
            0.50:'#166534',
            0.70:'#15803d',
            0.86:'#22c55e',
            1.00:'#4ade80'
        };
    }

    /* Heat overlay disabled: use geographic polygon colors only. */
    function addHeat(items,color,radius,blur,opacity){
        return null;
    }

    function setMunicipalityStyle(city){
        const color=CITY_COLOR[city] || '#94a3b8';
        const layer=municipalityBoundaryLayers[city];
        if(!layer) return;
        layer.setStyle({
            color:color,
            weight:2.5,
            opacity:.95,
            fillColor:color,
            fillOpacity:.22
        });
        layer.off('mouseover').off('mouseout').off('click');
        layer.on('click',()=>showMunicipality(city));
    }

    /* Python-equivalent contiguous angular grouping.
       IMPORTANT: this replaces the old round-robin index % 3 split. */
    function pythonGroupsOf(ds){
        ds=Array.isArray(ds)?ds.slice():[];
        if(!ds.length) return [[],[],[]];

        const valid=ds.filter(d=>Number.isFinite(Number(d.lat)) && Number.isFinite(Number(d.lng)));
        const source=valid.length ? valid : ds;
        const clat=source.reduce((s,d)=>s+Number(d.lat||0),0)/source.length;
        const clng=source.reduce((s,d)=>s+Number(d.lng||0),0)/source.length;

        const a=source.slice().sort((x,y)=>
            Math.atan2(Number(x.lat)-clat,Number(x.lng)-clng) -
            Math.atan2(Number(y.lat)-clat,Number(y.lng)-clng)
        );

        const n=a.length;
        const b=Math.floor(n/3);
        const r=n%3;
        const sizes=[b+(r>0?1:0),b+(r>1?1:0),b];
        const out=[];
        let st=0;
        for(let i=0;i<3;i++){
            out.push(a.slice(st,st+sizes[i]));
            st+=sizes[i];
        }
        return out;
    }

    /* Override the original split so every caller gets the Python grouping. */
    window.splitIntoThree = pythonGroupsOf;

    function canonicalDistrict(row,city){
        const raw=String(row.name||row.state||'').trim();
        const lookup=districtNameLookup[districtLookupKey(raw)];
        if(lookup && lookup.city===city) return lookup.name;
        if(districtToCity[raw]===city) return raw;
        return raw;
    }

    function cityDistrictItems(city){
        const rows=municipalityIncidentRows[city] || [];
        const byKey={};

        rows.forEach(row=>{
            const name=canonicalDistrict(row,city);
            if(!name) return;
            const key=districtLookupKey(name);
            const count=Number(getDistrictCount(name)||row.count||0);
            let lat=Number(row.lat), lng=Number(row.lng);
            if(!Number.isFinite(lat)||!Number.isFinite(lng)){
                const layer=districtLayers[name];
                if(layer && layer.getBounds().isValid()){
                    const c=layer.getBounds().getCenter();
                    lat=c.lat; lng=c.lng;
                }
            }
            if(!byKey[key]){
                byKey[key]={name,count,lat,lng,city};
            }else{
                /* Keep the original Grafana coordinate and count mapping. */
                if(Number.isFinite(lat)&&Number.isFinite(lng)){
                    byKey[key].lat=lat; byKey[key].lng=lng;
                }
            }
        });

        return Object.values(byKey).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng));
    }

    function groupCentroid(items){
        if(!items.length) return null;
        const lat=items.reduce((s,x)=>s+Number(x.lat),0)/items.length;
        const lng=items.reduce((s,x)=>s+Number(x.lng),0)/items.length;
        return {lat,lng};
    }

    function styleGroupDistrict(name,color,group,city){
        const layer=districtLayers[name];
        if(!layer) return;
        layer.setStyle({
            color:'transparent',
            weight:0,
            opacity:0,
            fillColor:color,
            fillOpacity:.34
        });
        layer.off('mouseover').off('mouseout').off('click');
        layer.on('click',()=>showDistrictLevel(group,city));
        if(!map.hasLayer(layer)) layer.addTo(map);
    }

    function styleDistrictRisk(name,risk){
        const layer=districtLayers[name];
        if(!layer) return;
        const color=risk==='High'?'#ef4444':risk==='Medium'?'#facc15':'#22c55e';
        layer.setStyle({
            color:'rgba(255,255,255,.78)',
            weight:1,
            opacity:.9,
            fillColor:color,
            fillOpacity:.42
        });
    }

    function classify(items){
        const vals=items.map(x=>Number(x.count)||0).sort((a,b)=>a-b);
        if(!vals.length) return {low:0,high:0};
        const low=vals[Math.floor((vals.length-1)/3)];
        const high=vals[Math.floor(2*(vals.length-1)/3)];
        return {low,high};
    }

    function riskFor(count,stats){
        count=Number(count)||0;
        if(count>=stats.high) return 'High';
        if(count>=stats.low) return 'Medium';
        return 'Low';
    }

    function addGroupHeatAndLabel(group,city,index){
        const items=group.items||[];
        const total=items.reduce((sum,x)=>sum+Number(x.count||0),0);
        const c=groupCentroid(items);
        if(c){
            makePlainLabel(
                c.lat,
                c.lng,
                Number(total || 0).toLocaleString(),
                'level-group-label',
                ()=>showDistrictLevel(group,city)
            );
        }
    }

    /* ================= LEVEL 1 ================= */
    function showMunicipalityOverview(){
        drillLevel=0;
        selectedMunicipality=null;
        selectedCluster=null;
        selectedSubCluster=null;
        currentClusters=[];

        ensureFinalLayers();
        clearFinalVisuals();
        hideAllDistrictLayers();
        showMunicipalityBoundaries();

        CITIES.forEach(city=>setMunicipalityStyle(city));

        CITIES.forEach(city=>{
            const rows=(municipalityIncidentRows[city]||[]).filter(x=>
                Number.isFinite(Number(x.lat)) && Number.isFinite(Number(x.lng)) && Number(x.count)>0
            );
            addHeat(rows,CITY_COLOR[city],58,42,.16);

            const center=municipalityCenters[city];
            const count=Number(municipalityTotals[city]||0);
            if(center){
                makePlainLabel(center.lat,center.long,count.toLocaleString(),'heat-number-label',()=>showMunicipality(city));
            }
        });

        const bounds=L.featureGroup(CITIES.map(c=>municipalityBoundaryLayers[c]).filter(Boolean)).getBounds();
        if(bounds.isValid()) map.fitBounds(bounds,{padding:[40,40],maxZoom:12,animate:false});

        updateMapInfo('<b>LEVEL 1</b> — Municipalities &nbsp; | &nbsp; Click Dammam, Khobar or Dhahran');
        updateBackButton();
        const title=document.querySelector('.map-title');
        if(title) title.innerHTML='Municipalities Overview';
    }

    /* ================= LEVEL 2 ================= */
    function showMunicipality(city){
        selectedMunicipality=city;
        selectedCluster=null;
        selectedSubCluster=null;
        drillLevel=1;

        ensureFinalLayers();
        clearFinalVisuals();
        hideAllDistrictLayers();
        hideMunicipalityBoundaries();

        const rows=cityDistrictItems(city);
        const groups=pythonGroupsOf(rows).map((items,index)=>({
            index,
            items,
            total:items.reduce((s,x)=>s+Number(x.count||0),0)
        }));
        currentClusters=groups;

        /* Show exactly three geographic groups using their real district polygons. */
        groups.forEach((group,index)=>{
            group.items.forEach(item=>styleGroupDistrict(item.name,GROUP_COLOR[index],group,city));
            addGroupHeatAndLabel(group,city,index);
        });

        const boundary=municipalityBoundaryLayers[city];
        if(boundary && boundary.getBounds().isValid()){
            map.fitBounds(boundary.getBounds(),{padding:[55,55],maxZoom:13,animate:false});
        }else{
            const pts=rows.map(x=>[x.lat,x.lng]);
            if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:14,animate:false});
        }

        updateMapInfo(`<b>LEVEL 2</b> — ${city} &nbsp; | &nbsp; 3 geographic areas &nbsp; | &nbsp; Centre value = SUM of incidents`);
        updateBackButton();
        const title=document.querySelector('.map-title');
        if(title) title.innerHTML=`${city} — 3 Areas`;
    }

    /* ================= LEVEL 3 ================= */
    function showSecondLevel(cluster,city){
        /* No sub-group level. A group goes directly to districts. */
        showDistrictLevel(cluster,city);
    }

    function showDistrictLevel(group,city){
        selectedCluster=group;
        selectedSubCluster=null;
        drillLevel=2;

        ensureFinalLayers();
        clearFinalVisuals();
        hideAllDistrictLayers();
        hideMunicipalityBoundaries();

        const rows=(group.items||[]).slice();
        /* Python-style ranking: bottom third Low, middle third Medium, top third High. */
        const ranked=rows.slice().sort((a,b)=>Number(a.count||0)-Number(b.count||0));
        const riskByKey={};
        const n=ranked.length;
        ranked.forEach((item,i)=>{
            const risk = n < 3
                ? (n===1 ? 'High' : (i===0 ? 'Low' : 'High'))
                : (i < Math.ceil(n/3) ? 'Low' : (i < Math.ceil(2*n/3) ? 'Medium' : 'High'));
            riskByKey[districtLookupKey(item.name)] = risk;
        });

        rows.forEach(item=>{
            const risk=riskByKey[districtLookupKey(item.name)] || 'Low';
            styleDistrictRisk(item.name,risk);
            const layer=districtLayers[item.name];
            if(layer){
                layer.off('mouseover').off('mouseout').off('click');
                layer.on('click',()=>{
                    window.parent.postMessage({
                        type:'mapClick',
                        state:item.name,
                        municipality:city,
                        lat:item.lat,
                        long:item.lng
                    },'*');
                });
                if(!map.hasLayer(layer)) layer.addTo(map);
                layer.bindTooltip(
                    `<b>${item.name}</b><br>Municipality: ${city}<br>Incidents: ${Number(item.count||0).toLocaleString()}<br>Risk: ${risk}`,
                    {sticky:true,direction:'top',opacity:.95,className:'custom-tooltip'}
                );
            }
        });

        /* NO HEAT OVERLAY — keep only district polygon colors and count labels. */

        rows.forEach(item=>{
            makePlainLabel(item.lat,item.lng,Number(item.count||0).toLocaleString(),'heat-number-label',()=>{
                window.parent.postMessage({
                    type:'mapClick',
                    state:item.name,
                    municipality:city,
                    lat:item.lat,
                    long:item.lng
                },'*');
            });
        });

        const pts=rows.map(x=>[x.lat,x.lng]);
        if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[75,75],maxZoom:16,animate:false});

        updateMapInfo(`<b>LEVEL 3</b> — ${city} / Group ${(Number(group.index)||0)+1} &nbsp; | &nbsp; Actual Districts &nbsp; | &nbsp; Click a district`);
        updateBackButton();
        const title=document.querySelector('.map-title');
        if(title) title.innerHTML=`${city} — Group ${(Number(group.index)||0)+1} — Districts`;
    }

    /* Back button: Level 3 -> Level 2 -> Level 1. */
    function finalBack(){
        if(drillLevel===2){
            showMunicipality(selectedMunicipality);
        }else if(drillLevel===1){
            showMunicipalityOverview();
        }
    }

    window.showMunicipalityOverview=showMunicipalityOverview;
    window.showMunicipality=showMunicipality;
    window.showSecondLevel=showSecondLevel;
    window.showDistrictLevel=showDistrictLevel;

    /* Replace old back-button behavior without removing the existing control. */
    document.addEventListener('click',function(e){
        const b=e.target.closest && e.target.closest('.map-back-button');
        if(!b) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        finalBack();
    },true);

    /* Satellite base layer on top of the original OSM base. */
    try{
        const satellite=L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {maxZoom:19,attribution:'Tiles &copy; Esri'}
        );
        satellite.addTo(map);
        if(osm && map.hasLayer(osm)) map.removeLayer(osm);
    }catch(e){ console.warn('Satellite layer unavailable',e); }

    console.log('FINAL 3-LEVEL OVERRIDE ACTIVE');
})();
</script>
